<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HR Scout">
<meta name="theme-color" content="#0f1117">
<title>HR Scout ⚾</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--bg2:#161b27;--bg3:#1c2333;--bdr:#2d3d52;
  --text:#f0f4f8;--text2:#c8d8e8;--muted:#90a0b0;--dim:#607080;
  --amber:#f0a500;--blue:#3d8ef0;--green:#22c95e;--red:#e0504a;
  --safe-t:env(safe-area-inset-top,44px);--safe-b:env(safe-area-inset-bottom,20px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:-webkit-fill-available}
body{background:var(--bg);color:var(--text2);font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;
  padding-bottom:calc(60px + var(--safe-b));font-size:14px;line-height:1.5}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:200;background:var(--bg);border-bottom:1px solid var(--bdr);
  padding:calc(var(--safe-t) + 8px) 16px 12px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:var(--text);flex:1}
.logo span{color:var(--amber)}
.date-pill{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;overflow:hidden}
.darr{background:none;border:none;color:var(--muted);font-size:.95rem;padding:7px 11px;cursor:pointer}
.darr:active{color:var(--amber)}
.dtxt{font-family:'JetBrains Mono',monospace;font-size:.71rem;color:var(--text);min-width:72px;text-align:center;padding:0 4px;font-weight:500}

/* BOTTOM NAV */
.botnav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bg);
  border-top:1px solid var(--bdr);display:flex;padding-bottom:var(--safe-b)}
.navbtn{flex:1;border:none;background:none;color:var(--dim);font-size:.62rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:9px 0 5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .15s}
.navbtn .ni{font-size:1.2rem;line-height:1}
.navbtn.active{color:var(--amber)}

/* PAGES */
.page{display:none}.page.active{display:block}
.sec-lbl{font-size:.66rem;font-weight:700;letter-spacing:.1em;color:var(--dim);
  text-transform:uppercase;padding:12px 16px 6px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* GAME GRID */
.game-grid{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 10px}
.gchip{flex:1;min-width:calc(33% - 6px);background:var(--bg2);border:1.5px solid var(--bdr);
  border-radius:9px;padding:9px 10px;cursor:pointer;text-align:center;transition:all .15s}
.gchip:active{transform:scale(.97)}
.gchip.sel{border-color:var(--amber);background:rgba(240,165,0,.08)}
.gc-teams{font-weight:700;font-size:.86rem;color:var(--text);white-space:nowrap}
.gchip.sel .gc-teams{color:var(--amber)}

/* WEATHER */
.wx-strip{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.wx-strip::-webkit-scrollbar{display:none}
.wchip{flex-shrink:0;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:6px 11px;text-align:center;min-width:64px}
.wv{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--text);font-weight:600;display:block}
.wl{font-size:.58rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:block;margin-top:2px}

/* PITCHER CARD */
.sp-card{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--bdr);
  border-left:3px solid var(--amber);border-radius:10px;padding:12px 14px}
.sp-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sp-name{font-weight:700;font-size:1rem;color:var(--text);flex:1;min-width:0}
.sp-hand{font-size:.67rem;color:var(--muted);background:var(--bg3);border-radius:4px;
  padding:2px 7px;font-weight:600;border:1px solid var(--bdr)}
.sp-stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.sp-stat{background:var(--bg3);border-radius:6px;border:1px solid var(--bdr);padding:5px 9px;text-align:center;min-width:46px}
.sp-v{font-family:'JetBrains Mono',monospace;font-size:.84rem;font-weight:600;color:var(--text);display:block}
.sp-l{font-size:.57rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:block;margin-top:2px}
.conf-badge{font-size:.63rem;font-weight:700;padding:2px 7px;border-radius:4px;display:inline-block}
.conf-g{background:#0d3320;color:#5fffb0;border:1px solid var(--green)}
.conf-y{background:#3a2800;color:#ffd166;border:1px solid var(--amber)}
.conf-r{background:#3d1110;color:#ff9999;border:1px solid var(--red)}
.ars-wrap{display:flex;flex-wrap:wrap;gap:4px}
.ac{font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:5px;border:1px solid;display:inline-block}

/* TEAM TOGGLE */
.team-tog{display:flex;margin:0 16px 8px;background:var(--bg2);border-radius:8px;
  padding:3px;gap:3px;border:1px solid var(--bdr)}
.team-btn{flex:1;border:none;background:none;color:var(--dim);font-weight:700;font-size:.82rem;
  padding:7px 4px;border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-btn.active{background:var(--bg3);color:var(--text);border:1px solid var(--bdr)}

/* SORT */
.sort-strip{display:flex;gap:5px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.sort-strip::-webkit-scrollbar{display:none}
.sort-btn{flex-shrink:0;font-size:.67rem;font-weight:600;padding:5px 11px;border-radius:99px;
  border:1px solid var(--bdr);background:var(--bg2);color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.sort-btn.active{border-color:var(--amber);color:var(--amber);background:rgba(240,165,0,.08)}

/* HITTER ROWS */
.h-wrap{padding:0 16px}
.h-row{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 12px;margin-bottom:7px;cursor:pointer;
  display:flex;align-items:center;gap:9px;transition:border-color .15s;
  -webkit-user-select:none;user-select:none}
.h-row:active{transform:scale(.99)}
.h-row.open{border-color:var(--blue);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.h-rank{font-weight:800;font-size:1rem;color:var(--dim);min-width:22px;text-align:center}
.r1{color:var(--amber)}.r2{color:var(--muted)}.r3{color:#b06030}
.h-info{flex:1;min-width:0}
.h-name{font-weight:700;font-size:.9rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-sub{font-size:.68rem;color:var(--dim);margin-top:1px}
.h-minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.mtag{font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:600;padding:2px 6px;border-radius:4px}
.h-sc{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sc-lbl{font-size:.58rem;color:var(--dim);text-align:right}

/* DETAIL PANEL */
.det-panel{background:var(--bg3);border:1px solid var(--blue);border-top:none;
  border-radius:0 0 10px 10px;padding:12px 14px;margin-bottom:7px}
.dtabs{display:flex;gap:3px;background:var(--bg2);border:1px solid var(--bdr);
  border-radius:8px;padding:3px;margin-bottom:12px}
.dtab{flex:1;border:none;background:none;color:var(--dim);font-size:.69rem;font-weight:700;
  padding:6px 3px;border-radius:6px;cursor:pointer;transition:all .15s;
  text-transform:uppercase;letter-spacing:.04em}
.dtab.active{background:var(--bg3);color:var(--text);border:1px solid var(--bdr)}

/* HEAT CELLS */
.hc{font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:600;
  padding:3px 8px;border-radius:5px;text-align:center;min-width:50px;display:inline-block}
.hcg{background:#0d3320;color:#5fffb0;border:1px solid var(--green)}
.hcy{background:#3a2800;color:#ffd166;border:1px solid var(--amber)}
.hcr{background:#3d1110;color:#ff9999;border:1px solid var(--red)}
.hcn{background:var(--bg3);color:var(--dim);border:1px solid var(--bdr)}

/* RISK PILLS */
.pill{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;
  padding:3px 10px;border-radius:99px;display:inline-block}
.pill-g{background:#0d3320;color:#5fffb0;border:1px solid var(--green)}
.pill-y{background:#3a2800;color:#ffd166;border:1px solid var(--amber)}
.pill-r{background:#3d1110;color:#ff9999;border:1px solid var(--red)}
.pill-b{background:#0e2448;color:#90c4ff;border:1px solid var(--blue)}

/* STAT ROWS */
.srow{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--bg2);font-size:.8rem}
.srow:last-child{border-bottom:none}
.srow-lbl{color:var(--muted);font-size:.76rem;font-weight:500}

/* L14 BOX */
.l14-box{background:rgba(240,165,0,.07);border:1px solid rgba(240,165,0,.25);
  border-radius:8px;padding:9px 11px;margin-bottom:10px}
.l14-title{font-size:.63rem;font-weight:800;color:var(--amber);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.l14-grid{display:flex;gap:8px;flex-wrap:wrap}
.l14-item{text-align:center}
.l14-val{display:block}
.l14-key{font-size:.57rem;color:var(--dim);display:block;margin-top:2px}

/* SCORE BREAKDOWN */
.sc-bkd{background:rgba(240,165,0,.06);border:1px solid rgba(240,165,0,.18);
  border-radius:8px;padding:10px 12px;margin-top:10px}
.sc-bkd-title{font-size:.62rem;font-weight:800;color:var(--amber);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.sc-row{display:flex;justify-content:space-between;align-items:center;
  font-size:.77rem;padding:4px 0;border-bottom:1px solid rgba(45,61,82,.4)}
.sc-row:last-child{border-bottom:none}
.sc-row-lbl{color:var(--muted);font-size:.73rem}
.sc-row-wt{color:var(--dim);font-size:.66rem;margin-left:4px}

/* PITCH TABLE */
.ptbl{width:100%;border-collapse:collapse;font-size:.74rem;margin-top:6px}
.ptbl th{color:var(--muted);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;
  padding:5px 4px;text-align:center;border-bottom:1px solid var(--bdr);font-weight:700}
.ptbl th:first-child{text-align:left}
.ptbl td{padding:5px 4px;text-align:center;border-bottom:1px solid rgba(45,61,82,.5);
  font-family:'JetBrains Mono',monospace;color:var(--text2)}
.ptbl td:first-child{text-align:left;font-weight:600;font-family:'Inter',sans-serif;color:var(--text)}
.ptbl tr:last-child td{border-bottom:none}
.ubar{height:5px;border-radius:3px;display:inline-block;vertical-align:middle}

/* PLATOON TABLE */
.plat-tbl{width:100%;border-collapse:collapse;font-size:.74rem;margin-top:6px}
.plat-tbl th{color:var(--muted);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;
  padding:5px 4px;text-align:center;border-bottom:1px solid var(--bdr);font-weight:700}
.plat-tbl th:first-child{text-align:left}
.plat-tbl td{padding:5px 4px;text-align:center;border-bottom:1px solid rgba(45,61,82,.5);
  font-family:'JetBrains Mono',monospace;color:var(--text2)}
.plat-tbl td:first-child{text-align:left;font-weight:700;font-family:'Inter',sans-serif;color:var(--text)}
.plat-hl{background:rgba(34,201,94,.07)}
.plat-tbl tr:last-child td{border-bottom:none}

/* COMPOSITE BOX */
.comp-box{background:rgba(61,142,240,.07);border:1px solid rgba(61,142,240,.2);
  border-radius:8px;padding:9px 11px;margin-top:9px}
.comp-lbl{font-size:.62rem;font-weight:700;color:var(--blue);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:7px}
.comp-grid{display:flex;gap:8px;flex-wrap:wrap}
.comp-item{text-align:center}
.comp-val{font-family:'JetBrains Mono',monospace;font-size:.8rem;display:block}
.comp-key{font-size:.57rem;color:var(--dim);display:block;margin-top:2px}

/* PITCHER PAGE */
.sp-bd{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.sp-bd-head{background:var(--bg3);padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp-bd-body{padding:12px 14px}

/* LOADERS */
.loader{text-align:center;padding:40px 20px;color:var(--dim)}
.spin{width:28px;height:28px;border:2px solid var(--bdr);border-top-color:var(--amber);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:32px 20px;color:var(--dim);font-size:.85rem;line-height:1.6}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">HR <span>Scout</span> ⚾</div>
  <div class="date-pill">
    <button class="darr" onclick="shiftDate(-1)">&#8249;</button>
    <div class="dtxt" id="dateTxt">—</div>
    <button class="darr" onclick="shiftDate(1)">&#8250;</button>
  </div>
</div>

<div class="page active" id="pg-slate">
  <div class="sec-lbl">Games</div>
  <div class="game-grid" id="gameGrid"><div class="loader"><div class="spin"></div><br>Loading…</div></div>
  <div class="wx-strip" id="wxBar"></div>
  <div id="spArea"></div>
  <div class="team-tog" id="teamTog" style="display:none">
    <button class="team-btn active" id="btnAway" onclick="setTeam('away')">—</button>
    <button class="team-btn" id="btnHome" onclick="setTeam('home')">—</button>
  </div>
  <div class="sort-strip" id="sortStrip"></div>
  <div class="h-wrap" id="hList"><div class="empty">Select a game above to get started</div></div>
</div>

<div class="page" id="pg-pitchers">
  <div class="sec-lbl">Starting Pitchers</div>
  <div id="spBd"><div class="empty">Select a game on the Slate tab</div></div>
</div>

<div class="botnav">
  <button class="navbtn active" id="nav-slate" onclick="goPage('slate',this)"><span class="ni">&#x1F4CB;</span>Slate</button>
  <button class="navbtn" id="nav-pitchers" onclick="goPage('pitchers',this)"><span class="ni">&#x26BE;</span>Pitchers</button>
</div>

<script>
'use strict';
const PARK={COL:1.18,CIN:1.10,PHI:1.09,BOS:1.08,NYY:1.07,MIL:1.05,HOU:1.04,ATL:1.04,CHC:1.03,TEX:1.03,LAD:1.02,STL:1.01,ARI:1.01,MIN:1.00,TOR:1.00,DET:1.00,WSH:0.99,MIA:0.98,NYM:0.98,ATH:0.97,SEA:0.97,SFG:0.96,SF:0.96,PIT:0.96,CLE:0.96,BAL:0.95,TBR:0.95,TB:0.95,KCR:0.95,KC:0.95,LAA:0.94,CHW:0.94,SDP:0.93,SD:0.93,OAK:0.97};
const PN={FF:'4-Seam',SI:'Sinker',FC:'Cutter',SL:'Slider',CU:'Curve',CH:'Change',FS:'Split',KC:'KnuckleCrv',ST:'Sweeper',SV:'Slurve',KN:'Knuckle'};
const PC={FF:'#e05050',SI:'#c03030',FC:'#e07830',SL:'#3d8ef0',ST:'#2060c0',SV:'#20a0b0',CU:'#9050d0',KC:'#6030b0',CH:'#30b050',FS:'#208040',KN:'#607080'};
const COORDS={'Yankee Stadium':[40.83,-73.93],'Fenway Park':[42.35,-71.10],'Wrigley Field':[41.95,-87.66],'Dodger Stadium':[34.07,-118.24],'Coors Field':[39.76,-104.99],'Oracle Park':[37.78,-122.39],'Globe Life Field':[32.75,-97.08],'Truist Park':[33.89,-84.47],'Citizens Bank Park':[39.91,-75.17],'Busch Stadium':[38.62,-90.19],'American Family Field':[43.03,-87.97],'Petco Park':[32.71,-117.16],'Chase Field':[33.45,-112.07],'T-Mobile Park':[47.59,-122.33],'Target Field':[44.98,-93.28],'Progressive Field':[41.50,-81.69],'Comerica Park':[42.34,-83.05],'Kauffman Stadium':[39.05,-94.48],'Minute Maid Park':[29.76,-95.36],'Angel Stadium':[33.80,-117.88],'Nationals Park':[38.87,-77.01],'PNC Park':[40.45,-80.01],'Citi Field':[40.76,-73.85],'Camden Yards':[39.28,-76.62]};
const MLB='https://statsapi.mlb.com/api/v1';
const PROX=[u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>`https://proxy.cors.sh/${u}`];

const S={date:new Date(),games:[],game:null,team:'away',sort:'hrScore',hitters:{away:[],home:[]},pRows:{away:null,home:null},arsenals:{away:{},home:{}},pHands:{away:'R',home:'R'},weather:null,openId:null,openTab:{}};
const _sc={};let _savB=null,_savP=null,_fgB=null,_fgP=null;

/* SCORING */
function ss(v,lo,hi,hib){if(v==null)return null;v=Math.max(lo,Math.min(hi,v));const r=hi===lo?.5:(v-lo)/(hi-lo);return hib?r*100:(1-r)*100;}
const L14M={barrel_pct:'l14_brl',hard_hit_pct:'l14_hard',avg_ev:'l14_ev',avg_la:'l14_la'};
function calcHS(r,l={}){
  const M=[['barrel_pct',3,18,true,28],['hard_hit_pct',30,55,true,22],['avg_ev',86,95,true,18],['avg_la',8,18,true,8],['sweet_spot_pct',25,42,true,8],['fb_pct',22,45,true,7],['pull_pct',28,50,true,5],['k_pct',6,30,false,4]];
  let tw=0,ts=0;
  for(const[c,lo,hi,hib,w]of M){const lk=L14M[c];const v=(lk&&l[lk]!=null)?l[lk]:r[c];if(v==null)continue;const sc=ss(v,lo,hi,hib);if(sc!=null){ts+=sc*w;tw+=w;}}
  return tw>=40?Math.round(ts/tw):null;
}
function calcHC(r,l={}){
  const M=[['barrel_pct',28],['hard_hit_pct',22],['avg_ev',18],['avg_la',8],['sweet_spot_pct',8],['fb_pct',7],['pull_pct',5],['k_pct',4]];
  const tot=100,found=M.reduce((a,[c,w])=>{const lk=L14M[c];return a+((lk&&l[lk]!=null)||r[c]!=null?w:0);},0);
  return Math.round(found/tot*100)/100;
}
const MA={brl_pct:6.5,hr_per_fb:12.0,hard_hit_pct:37.0,k_pct:22.0,fb_pct:35.0,avg_ev:88.0};
function calcPR(p){
  const M=[['brl_pct',2,14,true,30],['hr_per_fb',5,20,true,25],['hard_hit_pct',28,50,true,20],['k_pct',14,35,false,15],['fb_pct',20,50,true,7],['avg_ev',82,93,true,3]];
  const hr=p&&M.some(([c])=>p[c]!=null);let tw=0,ts=0;
  for(const[c,lo,hi,hib,w]of M){const v=(p&&p[c]!=null)?p[c]:(hr?null:MA[c]);if(v==null)continue;const sc=ss(v,lo,hi,hib);if(sc!=null){ts+=sc*w;tw+=w;}}
  return tw>0?Math.round(ts/tw):50;
}
function calcPC(p){const M=[['brl_pct',30],['hr_per_fb',25],['hard_hit_pct',20],['k_pct',15],['fb_pct',7],['avg_ev',3]];return Math.round(M.reduce((a,[c,w])=>a+(p&&p[c]!=null?w:0),0)/100*100)/100;}
function calcPM(sp,ar){const keys=['woba','xwoba','brl_pct','hard_pct','avg_ev','avg_la','whiff_pct'];const tw=Object.values(ar).reduce((a,b)=>a+b,0);if(!tw)return{};const acc={},wts={};for(const k of keys){acc[k]=0;wts[k]=0;}for(const[pt,pct]of Object.entries(ar)){const hvp=sp[pt]||{};const w=pct/tw;for(const k of keys){if(hvp[k]!=null){acc[k]+=hvp[k]*w;wts[k]+=w;}}}const out={};for(const k of keys)out[k]=wts[k]>0?acc[k]/wts[k]:null;return out;}
function calcHRS(h,pR,ws,pf,pm,platW,l={}){
  const hs=calcHS(h,l);const pfS=Math.max(0,Math.min(100,50+(pf-1)*100));const wsS=Math.max(0,Math.min(100,ws));
  const pmS=pm?.woba!=null?Math.max(0,Math.min(100,(pm.woba-.220)/(.420-.220)*100)):null;
  const plS=platW!=null?Math.max(0,Math.min(100,(platW-.220)/(.420-.220)*100)):null;
  const C=[];if(pR!=null)C.push([pR,.28]);if(pmS!=null)C.push([pmS,.25]);if(hs!=null)C.push([hs,.22]);if(plS!=null)C.push([plS,.18]);C.push([pfS,.05],[wsS,.02]);
  const tw=C.reduce((a,b)=>a+b[1],0);if(!tw)return null;
  return Math.max(0,Math.min(100,Math.round(C.reduce((a,b)=>a+b[0]*b[1],0)/tw)));
}

async function getSP(season){if(_savP)return _savP;const txt=await pxt(`https://baseballsavant.mlb.com/leaderboard/statcast?type=pitcher&year=${season}&position=&team=&min=10&csv=true`);if(!txt||txt.length<100)return{};const rows=txt.trim().split('\n');if(rows.length<2)return{};const hdrs=rows[0].split(',').map(h=>h.trim().replace(/"/g,'').toLowerCase());const idIdx=hdrs.findIndex(h=>['player_id','pitcher','mlbamid','xmlbamid'].includes(h));if(idIdx<0)return{};const out={};for(let i=1;i<rows.length;i++){const cols=rows[i].split(',').map(c=>c.trim().replace(/"/g,''));const pid=cols[idIdx]?.replace(/\.0$/,'');if(!pid||pid==='null')continue;const g=k=>{const i=hdrs.indexOf(k);return i>=0?parseFloat(cols[i])||null:null;};out[pid]={brl_pct:g('brl_percent'),hard_hit_pct:g('ev95percent'),avg_ev:g('avg_hit_speed')};}_savP=out;return out;}

async function getL14(batterId,season){
  const pid=String(batterId);const now=new Date();const start=new Date();start.setDate(start.getDate()-14);
  const fd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const txt=await pxt(`https://baseballsavant.mlb.com/statcast_search/csv?hfSea=${season}%7C&player_type=batter&battersLookup%5B%5D=${pid}&game_date_gt=${fd(start)}&game_date_lt=${fd(now)}&type=details&`);
  if(!txt||txt.length<100)return null;
  const rows=txt.trim().split('\n');if(rows.length<2)return null;
  const hdrs=rows[0].split(',').map(h=>h.trim().replace(/"/g,'').toLowerCase());
  const AB=new Set(['single','double','triple','home_run','field_out','grounded_into_double_play','strikeout','strikeout_double_play','force_out','field_error','fielders_choice','fielders_choice_out','double_play','triple_play','sac_fly','sac_bunt']);
  const g=(row,k)=>{const i=hdrs.indexOf(k);return i>=0?row[i]?.trim().replace(/"/g,''):null;};
  let evs=[],las=[],barrels=0,hrs=0,ab=0,bb=0,hbp=0,si=0,db=0,tr=0;const dates=new Set();
  for(let i=1;i<rows.length;i++){
    const cols=rows[i].split(',');const ev=parseFloat(g(cols,'launch_speed'));const la=parseFloat(g(cols,'launch_angle'));const evt=g(cols,'events')||'';const gd=g(cols,'game_date')||'';
    if(gd)dates.add(gd);
    if(!isNaN(ev)&&ev>0){evs.push(ev);if(!isNaN(la))las.push(la);if(ev>=98&&!isNaN(la)){const mx=Math.min(50,30+(ev-98));const mn=Math.max(8,26-(ev-98));if(la>=mn&&la<=mx)barrels++;}}
    if(AB.has(evt)){ab++;if(evt==='home_run')hrs++;else if(evt==='single')si++;else if(evt==='double')db++;else if(evt==='triple')tr++;}
    if(evt==='walk')bb++;if(evt==='hit_by_pitch')hbp++;
  }
  const nB=evs.length;const pa=ab+bb+hbp;if(nB===0&&pa===0)return null;
  const hc2=evs.filter(e=>e>=95).length;
  const woba=pa>0?(0.69*bb+0.72*hbp+0.89*si+1.27*db+1.62*tr+2.10*hrs)/pa:null;
  return{l14_brl:nB>0?Math.round(barrels/nB*1000)/10:null,l14_hard:nB>0?Math.round(hc2/nB*1000)/10:null,l14_ev:evs.length>0?Math.round(evs.reduce((a,b)=>a+b,0)/evs.length*10)/10:null,l14_la:las.length>0?Math.round(las.reduce((a,b)=>a+b,0)/las.length*10)/10:null,l14_hr:hrs,l14_woba:woba?Math.round(woba*1000)/1000:null,l14_games:dates.size,l14_pa:pa};
}

  const[awH,hmH,awA,hmA]=await Promise.all([getPH(g.awaySpId),getPH(g.homeSpId),getArs(g.awaySpId,2026),getArs(g.homeSpId,2026)]);

  const fgB=Object.keys(fb).length?fb:await getFB(2025);
  const fgP=Object.keys(fp).length?fp:await getFP(2025);

  async function buildPRow(spId){
    if(!spId)return null;const sid=String(spId);
    let row={era:null,fip:null,xfip:null,k_pct:null,bb_pct:null,gb_pct:null,fb_pct:null,hr_per_fb:null,brl_pct:null,hard_hit_pct:null,avg_ev:null};

  }
  const[pRA,pRH]=await Promise.all([buildPRow(g.homeSpId),buildPRow(g.awaySpId)]);
  S.pRows={away:pRA,home:pRH};renderSpCard();

  async function buildH(h,spHand,pRow,arsenal){
    const sid=String(h.id);let stats={};
    for(const yr of[2026,2025]){const d=await getPS(sid,yr);if(d?.hitting){stats=mapH(d.hitting);break;}}
    const fg=fgB[sid];if(fg){['pull_pct','fb_pct','swstr_pct','barrel_pct','hard_hit_pct','avg_ev','avg_la'].forEach(k=>{if(fg[k]!=null)stats[k]=fg[k];});}
    const sv=savB[sid];if(sv){['barrel_pct','hard_hit_pct','avg_ev','avg_la','sweet_spot_pct'].forEach(k=>{if(sv[k]!=null)stats[k]=sv[k];});}
    const l14=await getL14(sid,2026)||await getL14(sid,2025)||{};
    Object.assign(stats,l14);
    const pr=calcPR(pRow);const ws2=wxS(S.weather||{temp:72,rain:0,wind:0,wdir:0});
    const pfT=PARK[S.team==='away'?S.game?.home:S.game?.away]||1.00;
    const pm=calcPM({},arsenal);
    return{...h,...stats,spHand,pRow,arsenal,pitchSplits:{},platoon:{},l14,
      hs:calcHS(stats,l14),pm,platWoba:null,
      hrScore:calcHRS(stats,pr,ws2,pfT,pm,null,l14),
      hConf:calcHC(stats,l14)};
  }
  async function batchFetch(roster,spHand,pRow,arsenal){
    const res=[];const B=8;
    for(let i=0;i<roster.length;i+=B){
      const rows=await Promise.all(roster.slice(i,i+B).map(h=>buildH(h,spHand,pRow,arsenal)));
      res.push(...rows);
    }
    return res;
  }
  const[awH2,hmH2]=await Promise.all([batchFetch(awR,S.pHands.home,S.pRows.away,S.arsenals.away),batchFetch(hmR,S.pHands.away,S.pRows.home,S.arsenals.home)]);
  S.hitters.away=awH2;S.hitters.home=hmH2;renderHitters();
}

/* PITCHER CARD */
function renderSpCard(){
  const g=S.game;if(!g){document.getElementById('spArea').innerHTML='';return;}
  const spName=S.team==='away'?g.homeSpName:g.awaySpName;
  const spHand=S.team==='away'?S.pHands.home:S.pHands.away;
  const pRow=S.team==='away'?S.pRows.away:S.pRows.home;
  const risk=calcPR(pRow);const conf=calcPC(pRow);
  const pf=PARK[S.team==='away'?g.home:g.away]||1.00;
  const hasData=pRow&&Object.values(pRow).some(v=>v!=null);
  const avgNote=hasData?'':'<span style="font-size:.62rem;color:var(--amber);margin-left:4px">&#9733; lg avg</span>';
  const stats=pRow?[['ERA',fmt(pRow.era)],['FIP',fmt(pRow.fip)],['K%',fmt(pRow.k_pct,1,'%')],['BB%',fmt(pRow.bb_pct,1,'%')],['HR/FB',fmt(pRow.hr_per_fb,1,'%')],['GB%',fmt(pRow.gb_pct,1,'%')],['Park',`${pf.toFixed(2)}&times;`]].map(([l,v])=>`<div class="sp-stat"><span class="sp-v">${v}</span><span class="sp-l">${l}</span></div>`).join(''):'';
  const ars=S.arsenals[S.team];
  const arsH=Object.entries(ars).sort((a,b)=>b[1]-a[1]).map(([pt,pct])=>{const c=PC[pt]||'#607080';const nm=PN[pt]||pt;return`<span class="ac" style="color:${c};border-color:${c}44;background:${c}11">${nm} ${pct.toFixed(0)}%</span>`;}).join('')||'<span style="color:var(--dim);font-size:.71rem">Loading…</span>';
  document.getElementById('spArea').innerHTML=`<div class="sp-card"><div class="sp-head"><div class="sp-name">&#x26BE; ${spName}</div><div class="sp-hand">${spHand==='L'?'LHP':'RHP'}</div>${riskPill(risk)}${avgNote}${confB(conf)}</div>${stats?`<div class="sp-stats">${stats}</div>`:''}<div class="ars-wrap">${arsH}</div></div>`;
}

/* HITTER LIST */
function renderHitters(){
  const rows=[...(S.hitters[S.team]||[])];
  rows.sort((a,b)=>{const av=a[S.sort],bv=b[S.sort];if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return-1;return bv-av;});
  if(!rows.length){document.getElementById('hList').innerHTML='<div class="empty">No hitters loaded</div>';return;}
  renderSpCard();
  document.getElementById('hList').innerHTML=rows.map((h,i)=>{
    const isOpen=S.openId===h.id;
    const rk=i===0?'r1':i===1?'r2':i===2?'r3':'';
    const md=i===0?'&#x1F947;':i===1?'&#x1F948;':i===2?'&#x1F949;':`${i+1}`;
    const l=h.l14||{};
    const minis=[
      l.l14_brl!=null?[l.l14_brl,'Brl L14',4,15,true,'%']:(h.barrel_pct!=null?[h.barrel_pct,'Brl',4,15,true,'%']:null),
      l.l14_ev!=null?[l.l14_ev,'EV L14',86,94,true,' mph']:(h.avg_ev!=null?[h.avg_ev,'EV',86,94,true,' mph']:null),
      l.l14_la!=null?[l.l14_la,'LA L14',8,18,true,'°']:(h.avg_la!=null?[h.avg_la,'LA',8,18,true,'°']:null),
      l.l14_hr!=null&&l.l14_hr>0?[l.l14_hr,'HR L14',0,3,true,'']:null,
    ].filter(Boolean).map(([v,lb,lo,hi,hib,s])=>`<span class="mtag ${mtC(v,lo,hi,hib)}">${typeof v==='number'&&!Number.isInteger(v)?v.toFixed(1):v}${s} ${lb}</span>`).join('');
    return`<div class="h-row${isOpen?' open':''}" onclick="toggleH('${h.id}')"><div class="h-rank ${rk}">${md}</div><div class="h-info"><div class="h-name">${h.name} <span style="font-size:.67rem;color:var(--dim)">${h.batHand||'R'} &middot; ${h.pos}</span></div><div class="h-sub">${S.game?.[S.team==='away'?'away':'home']||''}</div>${minis?`<div class="h-minis">${minis}</div>`:''}</div><div class="h-sc">${sPill(h.hrScore,true)}<div class="sc-lbl">HR Score</div>${sPill(h.hs)}<div class="sc-lbl">Hitter</div>${h.hConf!=null?`<div>${confB(h.hConf)}</div>`:''}</div></div>${isOpen?`<div class="det-panel">${renderDetail(h)}</div>`:''}`;
  }).join('');
}

/* DETAIL */
function toggleH(id){S.openId=S.openId===id?null:id;if(!S.openTab[id])S.openTab[id]='stats';renderHitters();}
function setDTab(id,tab,ev){ev.stopPropagation();S.openTab[id]=tab;renderHitters();}
function renderDetail(h){
  const tab=S.openTab[h.id]||'stats';
  const spHand=S.team==='away'?S.pHands.home:S.pHands.away;
  const tabs=`<div class="dtabs" onclick="event.stopPropagation()"><button class="dtab${tab==='stats'?' active':''}" onclick="setDTab('${h.id}','stats',event)">Stats</button><button class="dtab${tab==='pitch'?' active':''}" onclick="setDTab('${h.id}','pitch',event)">vs Mix</button><button class="dtab${tab==='platoon'?' active':''}" onclick="setDTab('${h.id}','platoon',event)">Platoon</button></div>`;
  if(tab==='stats')return tabs+statsTab(h,spHand);
  if(tab==='pitch')return tabs+pitchTab(h);
  if(tab==='platoon')return tabs+platoonTab(h,spHand);
  return tabs;
}

function statsTab(h,spHand){
  const l=h.l14||{};const hasL=l.l14_ev!=null||l.l14_brl!=null;
  const l14H=hasL?`<div class="l14-box"><div class="l14-title">&#x1F525; Last 14 Days${l.l14_games?` &middot; ${l.l14_games}G`:''}${l.l14_pa?` &middot; ${l.l14_pa}PA`:''}</div><div class="l14-grid">${l.l14_brl!=null?`<div class="l14-item"><span class="l14-val">${hcp(l.l14_brl,4,15)}</span><span class="l14-key">BRL%</span></div>`:''} ${l.l14_hard!=null?`<div class="l14-item"><span class="l14-val">${hcp(l.l14_hard,32,52)}</span><span class="l14-key">HARD%</span></div>`:''} ${l.l14_ev!=null?`<div class="l14-item"><span class="l14-val">${hcv(l.l14_ev,86,94)}</span><span class="l14-key">EV</span></div>`:''} ${l.l14_la!=null?`<div class="l14-item"><span class="l14-val">${hc(l.l14_la,8,18,true,1,'&deg;')}</span><span class="l14-key">LA</span></div>`:''} ${l.l14_woba!=null?`<div class="l14-item"><span class="l14-val">${hcn(l.l14_woba,.290,.390)}</span><span class="l14-key">wOBA</span></div>`:''} ${l.l14_hr!=null?`<div class="l14-item"><span class="l14-val" style="font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:700;color:${l.l14_hr>0?'#ffd166':'var(--dim)'}">${l.l14_hr}</span><span class="l14-key">HR</span></div>`:''}</div></div>`:
  '<div style="font-size:.71rem;color:var(--dim);margin-bottom:8px">L14 loading…</div>';
  const sr=[['AVG',h.avg,.215,.300,true,3,''],['OBP',h.obp,.305,.385,true,3,''],['SLG',h.slg,.340,.520,true,3,''],['OPS',h.ops,.700,.900,true,3,''],['HR',h.hr,3,35,true,0,''],['Barrel%',h.barrel_pct,4,15,true,1,'%'],['Hard Hit%',h.hard_hit_pct,32,52,true,1,'%'],['Exit Velo',h.avg_ev,86,94,true,1,' mph'],['Launch&deg;',h.avg_la,8,18,true,1,'&deg;'],['Pull%',h.pull_pct,30,48,true,1,'%'],['FB%',h.fb_pct,22,42,true,1,'%'],['K%',h.k_pct,8,28,false,1,'%'],['BB%',h.bb_pct,5,14,true,1,'%'],['SwStr%',h.swstr_pct,5,14,false,1,'%'],['ISO',h.iso,.100,.250,true,3,'']].map(([lb,v,lo,hi,hib,dec,suf])=>`<div class="srow"><span class="srow-lbl">${lb}</span>${hc(v,lo,hi,hib,dec,suf)}</div>`).join('');
  const pRow=S.team==='away'?S.pRows.away:S.pRows.home;
  const pr=calcPR(pRow);const pConf=calcPC(pRow);const pf=PARK[S.team==='away'?S.game?.home:S.game?.away]||1.00;
  const ws=S.weather?wxS(S.weather):50;const pm=calcPM(h.pitchSplits,h.arsenal);
  const pmS=pm?.woba!=null?Math.round(Math.max(0,Math.min(100,(pm.woba-.220)/(.420-.220)*100))):null;
  const plS=h.platWoba!=null?Math.round(Math.max(0,Math.min(100,(h.platWoba-.220)/(.420-.220)*100))):null;
  const bkd=`<div class="sc-bkd"><div class="sc-bkd-title">HR Score Breakdown</div><div class="sc-row"><span class="srow-lbl">Final HR Score</span>${sPill(h.hrScore,true)}</div><div class="sc-row"><span class="srow-lbl">&#x26BE; Pitcher Risk <span class="sc-row-wt">28%</span></span>${riskPill(pr)} ${confB(pConf)}</div><div class="sc-row"><span class="srow-lbl">&#x1F3AF; Mix wOBA <span class="sc-row-wt">25%</span></span>${sPill(pmS)}</div><div class="sc-row"><span class="srow-lbl">&#x1F3CF; Hitter <span class="sc-row-wt">22%</span></span>${sPill(h.hs)} ${confB(h.hConf)}</div><div class="sc-row"><span class="srow-lbl">&#x26A1; Platoon <span class="sc-row-wt">18%</span></span>${sPill(plS)}</div><div class="sc-row"><span class="srow-lbl">&#x1F3DF;&#xFE0F; Park <span class="sc-row-wt">5%</span></span><span style="font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--text2)">${pf.toFixed(2)}&times;</span></div><div class="sc-row"><span class="srow-lbl">&#x2600;&#xFE0F; Weather <span class="sc-row-wt">2%</span></span><span style="font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--text2)">${Math.round(ws)}/100</span></div></div>`;
  return l14H+`<div style="font-size:.63rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px;display:flex;align-items:center;gap:6px">Season Stats<span style="flex:1;height:1px;background:var(--bdr);display:inline-block"></span></div>`+sr+bkd;
}

function pitchTab(h){
  const ar=h.arsenal||{};const sp=h.pitchSplits||{};const pts=Object.entries(ar).sort((a,b)=>b[1]-a[1]);
  if(!pts.length)return`<div class="empty">No arsenal data<br><small>Loads from Baseball Savant</small></div>`;
  const tr=pts.map(([pt,pct])=>{const nm=PN[pt]||pt;const cl=PC[pt]||'#607080';const hvp=sp[pt]||{};const bw=Math.min(48,Math.round(pct*.48));return`<tr><td><span style="color:${cl};font-weight:700">${nm}</span></td><td><span class="ubar" style="width:${bw}px;background:${cl}"></span> ${pct.toFixed(0)}%</td><td>${hcp(hvp.brl_pct,4,15)}</td><td>${hcp(hvp.hard_pct,32,52)}</td><td>${hcv(hvp.avg_ev,86,94)}</td><td>${hc(hvp.avg_la,8,18,true,1,'&deg;')}</td><td>${hcn(hvp.woba,.280,.400)}</td><td>${hcp(hvp.whiff_pct,18,35,false)}</td></tr>`;}).join('');
  const pm=calcPM(sp,ar);
  return`<div style="font-size:.67rem;color:var(--dim);margin-bottom:6px">SP% = usage &middot; stats = hitter league-wide vs pitch</div><table class="ptbl"><thead><tr><th>Pitch</th><th>SP%</th><th>BRL%</th><th>HH%</th><th>EV</th><th>LA</th><th>wOBA</th><th>Whiff</th></tr></thead><tbody>${tr}</tbody></table><div class="comp-box"><div class="comp-lbl">Weighted vs Arsenal</div><div class="comp-grid"><div class="comp-item"><span class="comp-val">${hcn(pm.woba,.290,.390)}</span><span class="comp-key">wOBA</span></div><div class="comp-item"><span class="comp-val">${hcp(pm.brl_pct,4,15)}</span><span class="comp-key">BRL%</span></div><div class="comp-item"><span class="comp-val">${hcp(pm.hard_pct,32,52)}</span><span class="comp-key">HARD%</span></div><div class="comp-item"><span class="comp-val">${hcv(pm.avg_ev,86,94)}</span><span class="comp-key">EV</span></div></div></div>`;
}

function platoonTab(h,spHand){
  const pl=h.platoon||{};if(!pl.R&&!pl.L)return`<div class="empty">Platoon data needs Streamlit backend</div>`;
  const rows=['R','L'].map(hand=>{const sp=pl[hand]||{};const hl=hand===spHand?'plat-hl':'';const st=hand===spHand?'&#9733; ':'';return`<tr class="${hl}"><td>${st}${hand==='R'?'RHP':'LHP'}</td><td>${sp.pa??'—'}</td><td>${sp.hr??'—'}</td><td>${hcn(sp.ba,.215,.305)}</td><td>${hcn(sp.obp,.305,.385)}</td><td>${hcn(sp.slg,.320,.520)}</td><td>${hcn(sp.woba,.290,.390)}</td></tr>`;}).join('');
  return`<table class="plat-tbl"><thead><tr><th>vs</th><th>PA</th><th>HR</th><th>AVG</th><th>OBP</th><th>SLG</th><th>wOBA</th></tr></thead><tbody>${rows}</tbody></table><div style="font-size:.66rem;color:var(--dim);margin-top:8px">&#9733; = today's matchup</div>`;
}

/* PITCHERS PAGE */
function renderPitchers(){
  const g=S.game;if(!g){document.getElementById('spBd').innerHTML='<div class="empty">Select a game on the Slate tab</div>';return;}
  const sps=[{name:g.homeSpName,hand:S.pHands.home,pRow:S.pRows.away,arsenal:S.arsenals.away,faces:g.away},{name:g.awaySpName,hand:S.pHands.away,pRow:S.pRows.home,arsenal:S.arsenals.home,faces:g.home}];
  document.getElementById('spBd').innerHTML=sps.map(sp=>{
    const risk=calcPR(sp.pRow);const conf=calcPC(sp.pRow);const p=sp.pRow||{};
    const hasD=Object.values(p).some(v=>v!=null);const avgN=hasD?'':'<span style="font-size:.62rem;color:var(--amber)"> &#9733; lg avg</span>';
    const sr=[['Barrel% allow','brl_pct',2,14,true,1,'%'],['Hard Hit% allow','hard_hit_pct',28,50,true,1,'%'],['EV allowed','avg_ev',83,92,true,1,' mph'],['K%','k_pct',14,35,false,1,'%'],['BB%','bb_pct',4,12,true,1,'%'],['FB% allow','fb_pct',20,48,true,1,'%'],['HR/FB%','hr_per_fb',5,20,true,1,'%'],['ERA','era',2,5,false,2,''],['FIP','fip',2,5,false,2,'']].map(([l,c,lo,hi,hib,dec,suf])=>`<div class="srow"><span class="srow-lbl">${l}</span>${hc(p[c],lo,hi,hib,dec,suf)}</div>`).join('');
    const arsH=Object.entries(sp.arsenal).sort((a,b)=>b[1]-a[1]).map(([pt,pct])=>{const c=PC[pt]||'#607080';const nm=PN[pt]||pt;const bw=Math.min(80,Math.round(pct*.8));return`<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:3px"><span style="color:${c};font-weight:700">${nm}</span><span style="font-family:'JetBrains Mono',monospace;color:var(--text2)">${pct.toFixed(1)}%</span></div><div style="background:var(--bdr);border-radius:3px;height:5px"><div style="background:${c};width:${bw}%;height:5px;border-radius:3px"></div></div></div>`;}).join('')||'<span style="color:var(--dim);font-size:.75rem">No arsenal data</span>';
    return`<div class="sp-bd"><div class="sp-bd-head"><div style="font-weight:700;font-size:1rem;color:var(--text);flex:1">${sp.name}</div><span style="font-size:.68rem;color:var(--muted)">${sp.hand==='L'?'LHP':'RHP'} &middot; vs ${sp.faces}</span>${riskPill(risk)}${avgN} ${confB(conf)}</div><div class="sp-bd-body"><div style="display:flex;gap:14px"><div style="flex:1"><div class="sec-lbl" style="padding:0 0 8px">Profile</div>${sr}</div><div style="flex:1"><div class="sec-lbl" style="padding:0 0 8px">Arsenal</div>${arsH}</div></div></div></div>`;
  }).join('');
}

loadSlate();
</script>
</body>
</html>
