<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HR Scout">
<meta name="theme-color" content="#0f1117">
<title>HR Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--bg2:#161b27;--bg3:#1c2333;--bdr:#2d3d52;
  --t1:#f0f4f8;--t2:#c8d8e8;--t3:#90a0b0;--t4:#607080;
  --amber:#f0a500;--blue:#3d8ef0;--green:#22c95e;--red:#e0504a;
  --g-bg:#0d3320;--g-tx:#5fffb0;--g-bd:#22c95e;
  --y-bg:#3a2800;--y-tx:#ffd166;--y-bd:#f0a500;
  --r-bg:#3d1110;--r-tx:#ff9999;--r-bd:#e0504a;
  --b-bg:#0e2448;--b-tx:#90c4ff;--b-bd:#3d8ef0;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;color:var(--t2);font-size:14px;line-height:1.5}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#topbar{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--bdr);
  padding:calc(var(--st)+10px) 14px 10px;display:flex;align-items:center;gap:10px;z-index:100}
#pages{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(62px + var(--sb))}
#botnav{flex-shrink:0;position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--bdr);display:flex;padding-bottom:var(--sb);z-index:100}
.logo{font-weight:800;font-size:1.2rem;letter-spacing:-.02em;color:var(--t1);flex:1}
.logo em{color:var(--amber);font-style:normal}
.dpill{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;overflow:hidden}
.dpill button{background:none;border:none;color:var(--t3);font-size:1rem;padding:6px 10px;cursor:pointer}
.dpill button:active{color:var(--amber)}
.dpill span{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--t1);min-width:68px;text-align:center;font-weight:500}
.nb{flex:1;background:none;border:none;color:var(--t4);font-size:.6rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:8px 0 5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nb i{font-size:1.2rem;font-style:normal;line-height:1}
.nb.on{color:var(--amber)}
.pg{display:none}.pg.on{display:block}
.slbl{font-size:.63rem;font-weight:700;letter-spacing:.1em;color:var(--t4);
  text-transform:uppercase;padding:12px 14px 5px;display:flex;align-items:center;gap:8px}
.slbl::after{content:'';flex:1;height:1px;background:var(--bdr)}
/* Games */
#gameGrid{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 8px}
.gc{flex:1;min-width:calc(33.33%-5px);max-width:calc(50%-3px);background:var(--bg2);
  border:1.5px solid var(--bdr);border-radius:9px;padding:8px 10px;cursor:pointer;text-align:center}
.gc:active{transform:scale(.96)}.gc.sel{border-color:var(--amber);background:rgba(240,165,0,.09)}
.gc-t{font-weight:700;font-size:.84rem;color:var(--t1)}.gc.sel .gc-t{color:var(--amber)}
.gc-sub{font-size:.6rem;color:var(--t4);margin-top:2px;font-family:'JetBrains Mono',monospace}
/* Weather */
#wxBar{display:flex;gap:5px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
#wxBar::-webkit-scrollbar{display:none}
.wc{flex-shrink:0;background:var(--bg2);border:1px solid var(--bdr);border-radius:7px;padding:5px 10px;text-align:center;min-width:58px}
.wv{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--t1);font-weight:600;display:block}
.wk{font-size:.56rem;color:var(--t4);text-transform:uppercase;letter-spacing:.05em;display:block;margin-top:1px}
/* Pitcher card */
.spc{margin:0 14px 10px;background:var(--bg2);border:1px solid var(--bdr);border-left:3px solid var(--amber);border-radius:10px;padding:12px 14px}
.sph{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.sp-name{font-weight:700;font-size:.98rem;color:var(--t1);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-hand{font-size:.65rem;background:var(--bg3);border:1px solid var(--bdr);border-radius:4px;padding:2px 7px;color:var(--t3);font-weight:600}
.sp-stats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.ss{background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;padding:5px 8px;text-align:center;min-width:44px}
.sv2{font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:600;color:var(--t1);display:block}
.sk{font-size:.55rem;color:var(--t4);text-transform:uppercase;letter-spacing:.05em;display:block;margin-top:2px}
.ars{display:flex;flex-wrap:wrap;gap:3px}
.ac{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid;display:inline-block;line-height:1.4}
/* L14 risk badge */
.l14r{font-size:.61rem;background:rgba(240,165,0,.12);color:var(--amber);padding:2px 7px;border-radius:4px;border:1px solid rgba(240,165,0,.3);font-weight:700;white-space:nowrap}
/* Team toggle */
#teamTog{display:none;margin:0 14px 7px;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:3px;gap:3px}
#teamTog button{flex:1;background:none;border:none;color:var(--t4);font-weight:700;font-size:.8rem;padding:7px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#teamTog button.on{background:var(--bg3);color:var(--t1);border:1px solid var(--bdr)}
/* Sort */
#sortStrip{display:flex;gap:5px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
#sortStrip::-webkit-scrollbar{display:none}
.sb2{flex-shrink:0;font-size:.65rem;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid var(--bdr);background:var(--bg2);color:var(--t3);cursor:pointer;white-space:nowrap}
.sb2.on{border-color:var(--amber);color:var(--amber);background:rgba(240,165,0,.09)}
/* Hitter rows */
#hList{padding:0 14px}
.hr-row{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:9px;-webkit-user-select:none;user-select:none}
.hr-row:active{transform:scale(.99)}
.hr-row.open{border-color:var(--blue);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.rk{font-weight:800;font-size:.95rem;min-width:22px;text-align:center;color:var(--t4)}
.rk.r1{color:var(--amber)}.rk.r2{color:var(--t3)}.rk.r3{color:#b06030}
.hi{flex:1;min-width:0}
.hn{font-weight:700;font-size:.88rem;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:.66rem;color:var(--t4);margin-top:1px}
.hmini{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.mt{font-family:'JetBrains Mono',monospace;font-size:.64rem;font-weight:600;padding:2px 6px;border-radius:4px;border:1px solid}
.hsc{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.scl{font-size:.56rem;color:var(--t4);text-align:right;margin-top:1px}
/* Detail panel */
.det{background:var(--bg3);border:1px solid var(--blue);border-top:none;border-radius:0 0 10px 10px;padding:12px 13px;margin-bottom:6px}
.dtabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:3px;margin-bottom:11px}
.dt{flex:1;background:none;border:none;color:var(--t4);font-size:.67rem;font-weight:700;padding:5px 3px;border-radius:6px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.dt.on{background:var(--bg3);color:var(--t1);border:1px solid var(--bdr)}
/* Heat cells */
.hc{font-family:'JetBrains Mono',monospace;font-size:.73rem;font-weight:600;padding:2px 8px;border-radius:4px;text-align:center;min-width:48px;display:inline-block;border:1px solid}
.hcg{background:var(--g-bg);color:var(--g-tx);border-color:var(--g-bd)}
.hcy{background:var(--y-bg);color:var(--y-tx);border-color:var(--y-bd)}
.hcr{background:var(--r-bg);color:var(--r-tx);border-color:var(--r-bd)}
.hcn{background:var(--bg3);color:var(--t4);border-color:var(--bdr)}
.sc{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:5px;text-align:center;min-width:42px;display:inline-block;border:1px solid}
.rp{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;display:inline-block;border:1px solid}
.rp-g{background:var(--g-bg);color:var(--g-tx);border-color:var(--g-bd)}
.rp-y{background:var(--y-bg);color:var(--y-tx);border-color:var(--y-bd)}
.rp-r{background:var(--r-bg);color:var(--r-tx);border-color:var(--r-bd)}
.rp-n{background:var(--b-bg);color:var(--b-tx);border-color:var(--b-bd)}
.cb{font-size:.61rem;font-weight:700;padding:2px 6px;border-radius:4px;display:inline-block;border:1px solid;vertical-align:middle}
.cb-g{background:var(--g-bg);color:var(--g-tx);border-color:var(--g-bd)}
.cb-y{background:var(--y-bg);color:var(--y-tx);border-color:var(--y-bd)}
.cb-r{background:var(--r-bg);color:var(--r-tx);border-color:var(--r-bd)}
/* Stat rows */
.srow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bg2);font-size:.79rem}
.srow:last-child{border-bottom:none}
.slb{color:var(--t3);font-size:.75rem;font-weight:500}
/* HR score boxes */
.hr-boxes{display:flex;gap:8px;margin:8px 0 11px}
.hr-box{flex:1;border-radius:8px;padding:8px 10px;min-width:80px}
.hr-box-form{background:rgba(240,165,0,.1);border:1.5px solid rgba(240,165,0,.35)}
.hr-box-ssn{background:rgba(61,142,240,.08);border:1px solid rgba(61,142,240,.22)}
.hr-box-lbl{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.hr-box-val{font-size:1.3rem;font-weight:800;line-height:1}
.hr-box-sub{font-size:.6rem;color:var(--t4);margin-top:3px}
/* HS boxes */
.hs-boxes{display:flex;gap:6px;margin:8px 0 10px;flex-wrap:wrap}
.hs-box{flex:1;min-width:80px;background:var(--bg2);border:1px solid var(--bdr);border-radius:7px;padding:7px 9px}
.hs-box-lbl{font-size:.57rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.hs-box-val{font-size:1rem;font-weight:800}
/* L14 box */
.l14b{background:rgba(240,165,0,.07);border:1px solid rgba(240,165,0,.22);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.l14t{font-size:.6rem;font-weight:800;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.l14g{display:flex;gap:8px;flex-wrap:wrap}
.l14i{text-align:center}.l14v{display:block}.l14k{font-size:.55rem;color:var(--t4);display:block;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
/* Score breakdown */
.scbkd{background:rgba(240,165,0,.06);border:1px solid rgba(240,165,0,.16);border-radius:8px;padding:9px 11px;margin-top:8px}
.scbt{font-size:.61rem;font-weight:800;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.scbt::after{content:'';flex:1;height:1px;background:rgba(240,165,0,.2)}
.scr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(45,61,82,.35);font-size:.76rem}
.scr:last-child{border-bottom:none}
.scrl{color:var(--t3);font-size:.72rem}
.scrw{color:var(--t4);font-size:.64rem;margin-left:3px}
.l14badge{font-size:.56rem;background:rgba(240,165,0,.15);color:var(--amber);padding:1px 4px;border-radius:3px;font-weight:700;vertical-align:middle;margin-left:2px}
/* Pitch table */
.ptbl{width:100%;border-collapse:collapse;font-size:.72rem;margin-top:4px}
.ptbl th{color:var(--t3);font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;padding:4px;text-align:center;border-bottom:1px solid var(--bdr);font-weight:700}
.ptbl th:first-child{text-align:left}
.ptbl td{padding:4px;text-align:center;border-bottom:1px solid rgba(45,61,82,.4);font-family:'JetBrains Mono',monospace;color:var(--t2)}
.ptbl td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:600;color:var(--t1)}
.ptbl tr:last-child td{border-bottom:none}
.ub{height:4px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:4px}
/* Platoon table */
.pltbl{width:100%;border-collapse:collapse;font-size:.72rem;margin-top:4px}
.pltbl th{color:var(--t3);font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;padding:4px;text-align:center;border-bottom:1px solid var(--bdr);font-weight:700}
.pltbl th:first-child{text-align:left}
.pltbl td{padding:4px;text-align:center;border-bottom:1px solid rgba(45,61,82,.4);font-family:'JetBrains Mono',monospace;color:var(--t2)}
.pltbl td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:700;color:var(--t1)}
.plt-hl{background:rgba(34,201,94,.07)}
/* Pitchers page */
.spbd{margin:0 14px 10px;background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.spbh{background:var(--bg3);padding:11px 13px;display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.spbb{padding:12px 13px}
/* AB table */
.abtbl{width:100%;border-collapse:collapse;font-size:.72rem}
.abtbl th{color:var(--t3);font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;padding:5px;text-align:center;border-bottom:2px solid var(--bdr);font-weight:700;white-space:nowrap}
.abtbl th:first-child{text-align:left}
.abtbl td{padding:5px;text-align:center;border-bottom:1px solid var(--bg2);font-family:'JetBrains Mono',monospace;color:var(--t2);white-space:nowrap}
.abtbl td:first-child{text-align:left;font-family:'Inter',sans-serif}
.ab-hr td{background:rgba(240,165,0,.08)!important;border-left:2px solid var(--amber)}
.ab-brl td{background:rgba(34,201,94,.06)!important;border-left:2px solid var(--green)}
.ev-h{color:var(--g-tx)!important;font-weight:700}.ev-m{color:var(--y-tx)!important;font-weight:600}.ev-l{color:var(--r-tx)!important}
.tag{font-family:'Inter',sans-serif;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid}
.tag-hr{background:var(--y-bg);color:var(--y-tx);border-color:var(--y-bd)}
.tag-hit{background:var(--b-bg);color:var(--b-tx);border-color:var(--b-bd)}
.tag-k{background:var(--r-bg);color:var(--r-tx);border-color:var(--r-bd)}
.tag-out{background:var(--bg3);color:var(--t4);border-color:var(--bdr)}
.abf{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:8px 14px;display:flex;flex-direction:column;gap:7px}
.abf-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.abf label{font-size:.62rem;color:var(--t4);font-weight:700;text-transform:uppercase;letter-spacing:.06em;min-width:52px}
.abf select{background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;color:var(--t1);font-size:.75rem;padding:5px 8px;font-family:'Inter',sans-serif;flex:1;min-width:0;-webkit-appearance:none;appearance:none;cursor:pointer}
.ptag{font-size:.67rem;font-weight:600;padding:3px 8px;border-radius:5px;border:1px solid var(--bdr);background:var(--bg3);color:var(--t3);cursor:pointer;user-select:none}
.ptag.on{border-color:var(--amber);color:var(--amber);background:rgba(240,165,0,.1)}
.ab-sum{display:flex;gap:5px;overflow-x:auto;padding:6px 14px;scrollbar-width:none}
.ab-sum::-webkit-scrollbar{display:none}
.asb{flex-shrink:0;background:var(--bg2);border:1px solid var(--bdr);border-radius:7px;padding:5px 9px;text-align:center;min-width:52px}
.asv{font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:700;color:var(--t1);display:block}
.ask{font-size:.55rem;color:var(--t4);text-transform:uppercase;letter-spacing:.05em;display:block;margin-top:1px}
/* Loaders */
.ldr{text-align:center;padding:36px 16px;color:var(--t4)}
.spin{width:26px;height:26px;border:2px solid var(--bdr);border-top-color:var(--amber);border-radius:50%;animation:sp .65s linear infinite;display:inline-block;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:28px 16px;color:var(--t4);font-size:.84rem;line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo">⚾ HR <em>Scout</em></div>
    <div class="dpill">
      <button onclick="shiftDate(-1)">&#8249;</button>
      <span id="dTxt">—</span>
      <button onclick="shiftDate(1)">&#8250;</button>
    </div>
  </div>
  <div id="pages">
    <div class="pg on" id="pg-slate">
      <div class="slbl">Games</div>
      <div id="gameGrid"><div class="ldr"><div class="spin"></div><br>Loading…</div></div>
      <div id="wxBar"></div>
      <div id="spArea"></div>
      <div id="teamTog" style="display:flex;display:none">
        <button id="tAway" onclick="setTeam('away')">—</button>
        <button id="tHome" onclick="setTeam('home')">—</button>
      </div>
      <div id="sortStrip"></div>
      <div id="hList"><div class="empty">Select a game above to begin</div></div>
    </div>
    <div class="pg" id="pg-pit">
      <div class="slbl">Pitcher Breakdown</div>
      <div id="pitchersContent"><div class="empty">Select a game on the Slate tab</div></div>
    </div>
    <div class="pg" id="pg-ab">
      <div class="slbl">AB Explorer</div>
      <div id="abFilter" class="abf"></div>
      <div id="abSummary"></div>
      <div id="abContent" style="padding:0 14px"><div class="empty">Select a game and hitter to explore at-bats</div></div>
    </div>
  </div>
  <div id="botnav">
    <button class="nb on" onclick="nav('slate',this)"><i>📋</i>Slate</button>
    <button class="nb"    onclick="nav('pit',this)"><i>⚾</i>Pitchers</button>
    <button class="nb"    onclick="nav('ab',this)"><i>🔬</i>AB Explorer</button>
  </div>
</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════════════════ */
const PARK={COL:1.18,CIN:1.10,PHI:1.09,BOS:1.08,NYY:1.07,MIL:1.05,HOU:1.04,ATL:1.04,CHC:1.03,TEX:1.03,LAD:1.02,STL:1.01,ARI:1.01,MIN:1.00,TOR:1.00,DET:1.00,WSH:0.99,MIA:0.98,NYM:0.98,ATH:0.97,SEA:0.97,SFG:0.96,SF:0.96,PIT:0.96,CLE:0.96,BAL:0.95,TBR:0.95,TB:0.95,KCR:0.95,KC:0.95,LAA:0.94,CHW:0.94,SDP:0.93,SD:0.93,OAK:0.97};

   SCORING — exact match to Streamlit Python
══════════════════════════════════════════════════════════ */
function _scl(v,lo,hi,hib){
  if(v==null)return null;
  v=Math.max(lo,Math.min(hi,v));
  const r=hi===lo?0.5:(v-lo)/(hi-lo);
  return hib?r*100:(1-r)*100;
}

// Season hitter score — all 8 metrics, no L14
function calcHS_Season(h){
  const M=[['barrel_pct',3,18,true,28],['hard_hit_pct',30,55,true,22],['avg_ev',86,95,true,18],
    ['avg_la',8,18,true,8],['sweet_spot_pct',25,42,true,8],['fb_pct',22,45,true,7],
    ['pull_pct',28,50,true,5],['k_pct',6,30,false,4]];
  let tw=0,ts=0;
  for(const[c,lo,hi,hib,w]of M){const v=h[c];if(v==null)continue;const s=_scl(v,lo,hi,hib);if(s!=null){ts+=s*w;tw+=w;}}
  return tw>=40?Math.round(ts/tw):null;
}

// L14 hitter score — barrel%+hard%+EV only (LA display only, excluded — noisy small sample)
function calcHS_L14(l){
  if(!l)return null;
  function gv(k1,k2){const v=l[k1]??l[k2];return(v!=null&&!isNaN(parseFloat(v)))?parseFloat(v):null;}
  const M=[
    [()=>gv('brl_pct','l14_brl'),  3, 18, true, 40],
    [()=>gv('hard_pct','l14_hard'),30, 55, true, 35],
    [()=>gv('avg_ev','l14_ev'),    86, 95, true, 25],
  ];
  let tw=0,ts=0;
  for(const[fn,lo,hi,hib,w]of M){const v=fn();if(v==null)continue;const s=_scl(v,lo,hi,hib);if(s!=null){ts+=s*w;tw+=w;}}
  return tw>=40?Math.round(ts/tw):null;
}

// Blended hitter score — L14 for brl/hard/EV/LA + season for rest
function calcHS_Blend(h,l){
  if(!l)return calcHS_Season(h);
  function gL(k1,k2){const v=l[k1]??l[k2];return(v!=null&&!isNaN(parseFloat(v)))?parseFloat(v):null;}
  const L14={barrel_pct:()=>gL('brl_pct','l14_brl'),hard_hit_pct:()=>gL('hard_pct','l14_hard'),avg_ev:()=>gL('avg_ev','l14_ev'),avg_la:()=>gL('avg_la','l14_la')};
  const M=[['barrel_pct',3,18,true,28],['hard_hit_pct',30,55,true,22],['avg_ev',86,95,true,18],
    ['avg_la',8,18,true,8],['sweet_spot_pct',25,42,true,8],['fb_pct',22,45,true,7],
    ['pull_pct',28,50,true,5],['k_pct',6,30,false,4]];
  let tw=0,ts=0;
  for(const[c,lo,hi,hib,w]of M){
    const v=(L14[c]?L14[c]():null)??h[c];
    if(v==null)continue;const s=_scl(v,lo,hi,hib);if(s!=null){ts+=s*w;tw+=w;}
  }
  return tw>=40?Math.round(ts/tw):null;
}

function calcHConf(h,l){
  const L14K={barrel_pct:['brl_pct','l14_brl'],hard_hit_pct:['hard_pct','l14_hard'],avg_ev:['avg_ev','l14_ev'],avg_la:['avg_la','l14_la']};
  const M=[['barrel_pct',28],['hard_hit_pct',22],['avg_ev',18],['avg_la',8],['sweet_spot_pct',8],['fb_pct',7],['pull_pct',5],['k_pct',4]];
  const tot=100,found=M.reduce((a,[c,w])=>{
    const hasL14=l&&(L14K[c]||[]).some(k=>l[k]!=null);
    return a+((hasL14||h[c]!=null)?w:0);
  },0);
  return Math.round(found/tot*100)/100;
}

// Season pitcher risk
const MLB_AVG={p_brl_pct:6.5,p_hr_per_fb:12.0,p_hard_hit_pct:37.0,p_k_pct:22.0,p_fb_pct:35.0,p_avg_ev:88.0};
function calcPR_Season(p){
  const M=[['p_brl_pct',2,14,true,30],['p_hr_per_fb',5,20,true,25],['p_hard_hit_pct',28,50,true,20],['p_k_pct',14,35,false,15],['p_fb_pct',20,50,true,7],['p_avg_ev',82,93,true,3]];
  const hasReal=p&&M.some(([c])=>p[c]!=null);
  let tw=0,ts=0;
  for(const[c,lo,hi,hib,w]of M){const v=(p&&p[c]!=null)?p[c]:(hasReal?null:MLB_AVG[c]);if(v==null)continue;const s=_scl(v,lo,hi,hib);if(s!=null){ts+=s*w;tw+=w;}}
  return tw>0?Math.round(ts/tw):50;
}
function calcPConf(p){const M=[['p_brl_pct',30],['p_hr_per_fb',25],['p_hard_hit_pct',20],['p_k_pct',15],['p_fb_pct',7],['p_avg_ev',3]];return Math.round(M.reduce((a,[c,w])=>a+(p&&p[c]!=null?w:0),0)/100*100)/100;}

// L14 pitcher risk — barrel%+hard% allowed only (EV excluded, redundant in small sample)
function calcPR_L14(pl){
  if(!pl)return null;
  const M=[['l14_brl',2,14,true,55],['l14_hard',28,50,true,45]];
  let tw=0,ts=0;
  for(const[c,lo,hi,hib,w]of M){const v=pl[c];if(v==null)continue;const s=_scl(v,lo,hi,hib);if(s!=null){ts+=s*w;tw+=w;}}
  return tw>=40?Math.round(ts/tw):null;
}

function calcPM(splits,arsenal){
  const keys=['brl_pct','hard_pct','avg_ev','avg_la','woba','xwoba','whiff_pct'];
  const tw=Object.values(arsenal).reduce((a,b)=>a+b,0);if(!tw)return{};
  const acc={},wts={};for(const k of keys){acc[k]=0;wts[k]=0;}
  for(const[pt,pct]of Object.entries(arsenal)){const hvp=splits[pt]||{};const w=pct/tw;for(const k of keys){if(hvp[k]!=null){acc[k]+=hvp[k]*w;wts[k]+=w;}}}
  const out={};for(const k of keys)out[k]=wts[k]>0?acc[k]/wts[k]:null;
  return out;
}

// HR Score — shared formula, takes already-resolved hitter score and pitcher risk
function _calcHRS(hs,pr,pm,platW,pf,ws){
  const pfS=Math.max(0,Math.min(100,50+(pf-1)*100));
  const wsS=Math.max(0,Math.min(100,ws));
  const pmS=pm?.woba!=null?Math.max(0,Math.min(100,(pm.woba-.220)/(.420-.220)*100)):null;
  const plS=platW!=null?Math.max(0,Math.min(100,(platW-.220)/(.420-.220)*100)):null;
  const C=[];
  if(pr!=null)C.push([pr,.28]);if(pmS!=null)C.push([pmS,.25]);
  if(hs!=null)C.push([hs,.22]);if(plS!=null)C.push([plS,.18]);
  C.push([pfS,.05],[wsS,.02]);
  const tw=C.reduce((a,b)=>a+b[1],0);if(!tw)return null;
  return Math.max(0,Math.min(100,Math.round(C.reduce((a,b)=>a+b[0]*b[1],0)/tw)));
}

// Form HR Score — L14 hitter + L14 pitcher (falls back to season if L14 unavailable)
// Returns null if NEITHER L14 hitter nor L14 pitcher data exists
function calcHRS_Form(h,pr_season,pm,platW,pf,ws,l14,pl14){
  const hs_l14=calcHS_L14(l14);
  const pr_l14=calcPR_L14(pl14);
  if(hs_l14==null&&pr_l14==null)return null;
  const hs=hs_l14!=null?hs_l14:calcHS_Season(h);
  const pr=pr_l14!=null?pr_l14:pr_season;
  return _calcHRS(hs,pr,pm,platW,pf,ws);
}

// Season HR Score — all season stats
function calcHRS_Season(h,pr,pm,platW,pf,ws,l14){
  const hs=calcHS_L14(l14)??calcHS_Blend(h,l14)??calcHS_Season(h);
  return _calcHRS(hs,pr,pm,platW,pf,ws);
}

  const c=p>=.65?'hcg':p>=.45?'hcy':'hcr';
  return`<span class="hc ${c}">${(+v).toFixed(dec)}${suf}</span>`;
}

function mtCls(v,lo,hi,hib){if(v==null)return'';let p=Math.max(0,Math.min(1,(v-lo)/(hi-lo)));if(!hib)p=1-p;return p>=.65?'hcg':p>=.45?'hcy':'hcr';}

async function pickGame(idx){
  S.game=S.games[idx];S.openId=null;S.hitters={away:[],home:[]};S.pRows={away:null,home:null};S.pL14={away:null,home:null};S.arsenals={away:{},home:{}};
  renderGameChips();
  const g=S.game;
  const pf=S._slatePark[g.pk]||PARK[g.home]||1.00;
  const w=S._slateWeather[g.pk]||{temp:72,rain:0,wind:0,wdir:0};
  S.weather=w;const ws=wxS(w);

  document.getElementById('wxBar').innerHTML=[
    ['🌡️',`${Math.round(w.temp)}°F`,'Temp'],
    ['💨',wLbl(w.wind,w.wdir),'Wind'],
    ['🌧️',`${Math.round(w.rain)}%`,'Rain'],
    ['🏟️',`${pf.toFixed(2)}×`,'Park'],
    ['☀️',`${Math.round(ws)}/100`,'Wx'],
  ].map(([ic,v,l])=>`<div class="wc"><span class="wv">${ic} ${v}</span><span class="wk">${l}</span></div>`).join('');

  document.getElementById('hList').innerHTML='<div class="ldr"><div class="spin"></div><br>Loading…</div>';

  // Parallel: pitcher hands, arsenals, leaderboards, rosters, pitcher L14
  const[awH,hmH,awA,hmA,awR,hmR,sb26,sp26,fb26,fp26]=await Promise.all([
    getPH(g.awaySpId),getPH(g.homeSpId),
    getArsenal(g.awaySpId,2026),getArsenal(g.homeSpId,2026),
    getRoster(g.away),getRoster(g.home),
    getSB(2026),getSP(2026),getFB(2026),getFP(2026),
  ]);
  S.pHands={away:awH,home:hmH};
  S.arsenals={away:hmA,home:awA}; // away batters face home SP (hmA), home face away SP (awA)

  // Leaderboard fallbacks
  const savB=Object.keys(sb26).length>10?sb26:(await getSB(2025).catch(()=>sb26));
  const savP=Object.keys(sp26).length>10?sp26:(await getSP(2025).catch(()=>sp26));
  const fgB=Object.keys(fb26).length>10?fb26:(await getFB(2025).catch(()=>fb26));
  const fgP=Object.keys(fp26).length>10?fp26:(await getFP(2025).catch(()=>fp26));

  // Team toggle
  const tog=document.getElementById('teamTog');tog.style.display='flex';
  document.getElementById('tAway').textContent=`${g.away} vs ${g.homeSpName.split(' ').pop()}`;
  document.getElementById('tHome').textContent=`${g.home} vs ${g.awaySpName.split(' ').pop()}`;
  document.getElementById('tAway').classList.add('on');document.getElementById('tHome').classList.remove('on');
  S.team='away';renderSorts();

  // Build pitcher rows
  async function buildPRow(spId){
    if(!spId)return{};const sid=String(spId);
    const row={era:null,fip:null,p_k_pct:null,p_bb_pct:null,p_brl_pct:null,p_hr_per_fb:null,p_hard_hit_pct:null,p_fb_pct:null,p_avg_ev:null};
    try{const d=await wfetch(`/pitcher?id=${sid}&season=2026`);if(d?.pitching){const s=d.pitching;const n=v=>v!=null?parseFloat(v):null;const so=n(s.strikeOuts),bf=n(s.battersFaced),bb=n(s.baseOnBalls);row.era=n(s.era);row.p_k_pct=so&&bf?Math.round(so/bf*1000)/10:null;row.p_bb_pct=bb&&bf?Math.round(bb/bf*1000)/10:null;}}catch{}
    const fg=fgP[sid];if(fg)for(const[k,v]of Object.entries(fg)){if(v!=null)row[k]=v;}
    const sv=savP[sid];if(sv){if(sv.p_brl_pct!=null)row.p_brl_pct=sv.p_brl_pct;if(sv.p_hard_hit_pct!=null)row.p_hard_hit_pct=sv.p_hard_hit_pct;if(sv.p_avg_ev!=null)row.p_avg_ev=sv.p_avg_ev;}
    return row;
  }
  const[pRA,pRH]=await Promise.all([buildPRow(g.homeSpId),buildPRow(g.awaySpId)]);
  S.pRows={away:pRA,home:pRH};

  // Pitcher L14 (away batters face home SP → home SP's L14 is away_p_l14)
  const[awPL14,hmPL14]=await Promise.all([
    getPL14(g.homeSpId,2026).catch(()=>null)||getPL14(g.homeSpId,2025).catch(()=>null),
    getPL14(g.awaySpId,2026).catch(()=>null)||getPL14(g.awaySpId,2025).catch(()=>null),
  ]);
  S.pL14={away:awPL14,home:hmPL14};

  renderSpCard();

  // Build hitter
  async function buildH(h,spHand,pRow,pL14data,arsenal){
    const sid=String(h.id);let stats={};
    try{const d=await wfetch(`/player-stats?id=${sid}&season=2026`);if(d?.hitting)stats=mapH(d.hitting);}catch{
      try{const d2=await wfetch(`/player-stats?id=${sid}&season=2025`);if(d2?.hitting)stats=mapH(d2.hitting);}catch{}
    }
    const fg=fgB[sid];if(fg){['pull_pct','fb_pct','swstr_pct','barrel_pct','hard_hit_pct','avg_ev','avg_la'].forEach(k=>{if(fg[k]!=null)stats[k]=fg[k];});}
    const sv=savB[sid];if(sv){['barrel_pct','hard_hit_pct','avg_ev','avg_la','sweet_spot_pct'].forEach(k=>{if(sv[k]!=null)stats[k]=sv[k];});}
    const l14=await getL14(sid,2026).catch(()=>null)||await getL14(sid,2025).catch(()=>null)||{};
    Object.assign(stats,l14);
    const pr_s=calcPR_Season(pRow);
    const ws2=wxS(S.weather||{temp:72,rain:0,wind:0,wdir:0});
    const pfT=PARK[S.team==='away'?S.game?.home:S.game?.away]||1.00;
    const pm=calcPM({},arsenal);
    const hs_l14=calcHS_L14(l14);
    const hs_ssn=calcHS_Season(stats);
    const hs_blend=calcHS_Blend(stats,l14);
    const hrFormScore=calcHRS_Form(stats,pr_s,pm,null,pfT,ws2,l14,pL14data);
    const hrScore=calcHRS_Season(stats,pr_s,pm,null,pfT,ws2,l14);
    return{...h,...stats,l14,spHand,pRow,pL14:pL14data,arsenal,pitchSplits:{},platoon:{},
      hs_l14,hs_season:hs_ssn,hs_blend,
      hrFormScore,hrScore,
      hConf:calcHConf(stats,l14),
      l14_brl:l14.brl_pct??l14.l14_brl,l14_hard:l14.hard_pct??l14.l14_hard,
      l14_ev:l14.avg_ev??l14.l14_ev,l14_la:l14.avg_la??l14.l14_la,
      l14_hr:l14.hr??l14.l14_hr,l14_woba:l14.woba??l14.l14_woba,l14_pa:l14.pa??l14.l14_pa,l14_games:l14.games??l14.l14_games};
  }

  async function buildAll(roster,spHand,pRow,pL14data,arsenal,teamKey){
    if(!roster.length)return[];
    const ids=roster.map(h=>String(h.id)).join(',');
    let batchData={};
    try{const r=await fetch(`${WORKER_URL}/batch-hitters?ids=${ids}&season=2026&spHand=${spHand}&team=${teamKey}`);if(r.ok)batchData=await r.json();}catch{}
    const pr_s=calcPR_Season(pRow);
    const ws2=wxS(S.weather||{temp:72,rain:0,wind:0,wdir:0});
    const pfT=PARK[teamKey==='away'?S.game?.home:S.game?.away]||1.00;
    const pm=calcPM({},arsenal);
    return await Promise.all(roster.map(async h=>{
      const sid=String(h.id);
      const bd=batchData[sid];
      let stats=bd?.stats||{};
      // If batch didn't work, try individual
      if(!Object.values(stats).some(v=>v!=null)){
        try{const d=await wfetch(`/player-stats?id=${sid}&season=2026`);if(d?.hitting)stats=mapH(d.hitting);}catch{}
        const fg=fgB[sid];if(fg){['pull_pct','fb_pct','swstr_pct','barrel_pct','hard_hit_pct','avg_ev','avg_la'].forEach(k=>{if(fg[k]!=null)stats[k]=fg[k];});}
        const sv=savB[sid];if(sv){['barrel_pct','hard_hit_pct','avg_ev','avg_la','sweet_spot_pct'].forEach(k=>{if(sv[k]!=null)stats[k]=sv[k];});}
      }
      const l14=bd?.l14||await getL14(sid,2026).catch(()=>null)||{};
      Object.assign(stats,l14);
      const hs_l14=calcHS_L14(l14);
      const hs_ssn=calcHS_Season(stats);
      const hrFormScore=calcHRS_Form(stats,pr_s,pm,null,pfT,ws2,l14,pL14data);
      const hrScore=calcHRS_Season(stats,pr_s,pm,null,pfT,ws2,l14);
      return{...h,...stats,l14,spHand,pRow,pL14:pL14data,arsenal,pitchSplits:{},platoon:{},
        hs_l14,hs_season:hs_ssn,hs_blend:calcHS_Blend(stats,l14),
        hrFormScore,hrScore,hConf:calcHConf(stats,l14),
        l14_brl:l14.brl_pct??l14.l14_brl,l14_hard:l14.hard_pct??l14.l14_hard,
        l14_ev:l14.avg_ev??l14.l14_ev,l14_la:l14.avg_la??l14.l14_la,
        l14_hr:l14.hr??l14.l14_hr,l14_woba:l14.woba??l14.l14_woba,
        l14_pa:l14.pa??l14.l14_pa,l14_games:l14.games??l14.l14_games};
    }));
  }

  S.hitters={away:[],home:[]};
  const awayP=buildAll(awR,S.pHands.home,S.pRows.away,S.pL14.away,S.arsenals.away,'away').then(rows=>{S.hitters.away=rows;if(S.team==='away')renderHitters();return rows;});
  const homeP=buildAll(hmR,S.pHands.away,S.pRows.home,S.pL14.home,S.arsenals.home,'home').then(rows=>{S.hitters.home=rows;if(S.team==='home')renderHitters();return rows;});
  await Promise.all([awayP,homeP]);
  renderHitters();
}

/* ══════════════════════════════════════════════════════════
   PITCHER CARD
══════════════════════════════════════════════════════════ */
function renderSpCard(){
  const g=S.game;if(!g){document.getElementById('spArea').innerHTML='';return;}
  const spName=S.team==='away'?g.homeSpName:g.awaySpName;
  const spHand=S.team==='away'?S.pHands.home:S.pHands.away;
  const pRow=S.team==='away'?S.pRows.away:S.pRows.home;
  const pl14=S.team==='away'?S.pL14.away:S.pL14.home;
  const pr_s=calcPR_Season(pRow);const pr_l14=calcPR_L14(pl14);
  const pr=pr_l14!=null?pr_l14:pr_s;
  const conf=calcPConf(pRow);
  const pf=PARK[S.team==='away'?g.home:g.away]||1.00;
  const hasData=pRow&&Object.values(pRow).some(v=>v!=null);
  const avgNote=hasData?'':`<span style="font-size:.6rem;color:var(--amber)">★ lg avg</span>`;
  const l14Note=pr_l14!=null
    ?`<span class="l14r">🔥 L14 Risk: ${pr_l14} · Brl: ${fmt(pl14?.l14_brl,1,'%')} HH: ${fmt(pl14?.l14_hard,1,'%')}</span>`
    :'';
  const statsHtml=[['ERA',fmt(pRow?.era)],['FIP',fmt(pRow?.fip)],['K%',fmt(pRow?.p_k_pct,1,'%')],['BB%',fmt(pRow?.p_bb_pct,1,'%')],['HR/FB',fmt(pRow?.p_hr_per_fb,1,'%')],['FB%',fmt(pRow?.p_fb_pct,1,'%')],['Park',`${pf.toFixed(2)}×`]]
    .map(([l,v])=>`<div class="ss"><span class="sv2">${v}</span><span class="sk">${l}</span></div>`).join('');
  const arsHtml=Object.entries(S.arsenals[S.team]).sort((a,b)=>b[1]-a[1])
    .map(([pt,pct])=>{const c=PC[pt]||'#607080';const nm=PN[pt]||pt;return`<span class="ac" style="color:${c};border-color:${c}44;background:${c}11">${nm} ${pct.toFixed(0)}%</span>`;}).join('')||`<span style="color:var(--t4);font-size:.71rem">Loading arsenal…</span>`;
  document.getElementById('spArea').innerHTML=`
    <div class="spc">
      <div class="sph">
        <div class="sp-name">⚾ ${spName}</div>
        <div class="sp-hand">${spHand==='L'?'LHP':'RHP'}</div>
        ${rpill(pr)} ${avgNote} ${cb(conf)} ${l14Note}
      </div>
      <div class="sp-stats">${statsHtml}</div>
      <div class="ars">${arsHtml}</div>
    </div>`;
}

/* ══════════════════════════════════════════════════════════
   HITTER LIST
══════════════════════════════════════════════════════════ */
function renderHitters(){
  const rows=[...(S.hitters[S.team]||[])];
  rows.sort((a,b)=>{const av=a[S.sort],bv=b[S.sort];if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return-1;return bv-av;});
  if(!rows.length){document.getElementById('hList').innerHTML='<div class="empty">No hitters loaded</div>';return;}
  renderSpCard();
  document.getElementById('hList').innerHTML=rows.map((h,i)=>{
    const isOpen=S.openId===h.id;
    const rkCls=i===0?'r1':i===1?'r2':i===2?'r3':'';
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`<span style="font-size:.8rem">${i+1}</span>`;
    const l=h.l14||{};

    // Mini tags
    const formScore=h.hrFormScore;const ssnScore=h.hrScore;
    const l14brl=h.l14_brl;const l14hard=h.l14_hard;const l14ev=h.l14_ev;
    const minis=[
      l14brl!=null?[l14brl,'Brl',4,15,true,'%']:h.barrel_pct!=null?[h.barrel_pct,'Brl',4,15,true,'%']:null,
      l14hard!=null?[l14hard,'HH',30,55,true,'%']:h.hard_hit_pct!=null?[h.hard_hit_pct,'HH',30,55,true,'%']:null,
      l14ev!=null?[l14ev,'EV',86,95,true,' mph']:h.avg_ev!=null?[h.avg_ev,'EV',86,95,true,' mph']:null,
      h.l14_hr!=null&&h.l14_hr>0?[h.l14_hr,'HR L14',0,3,true,'']:null,
    ].filter(Boolean).map(([v,lb,lo,hi,hib,su])=>{
      const c=mtCls(v,lo,hi,hib);
      const[bg,bd,tx]=c==='hcg'?['var(--g-bg)','var(--g-bd)','var(--g-tx)']:c==='hcy'?['var(--y-bg)','var(--y-bd)','var(--y-tx)']:['var(--bg3)','var(--bdr)','var(--t4)'];
      const isL14=lb.includes('Brl')||lb.includes('HH')||lb.includes('EV');
      return`<span class="mt" style="background:${bg};border-color:${bd};color:${tx}">${typeof v==='number'&&!Number.isInteger(v)?v.toFixed(1):v}${su} ${lb}${isL14&&(l14brl!=null||l14hard!=null||l14ev!=null)?'<span class="l14badge" style="margin-left:2px">L14</span>':''}</span>`;
    }).join('');

    return`
      <div class="hr-row${isOpen?' open':''}" onclick="toggleH('${h.id}')">
        <div class="rk ${rkCls}">${medal}</div>
        <div class="hi">
          <div class="hn">${h.name} <span style="font-size:.65rem;color:var(--t4)">${h.batHand||'R'} · ${h.pos}</span></div>
          <div class="hsub">${S.game?.[S.team==='away'?'away':'home']||''}</div>
          ${minis?`<div class="hmini">${minis}</div>`:''}
        </div>
        <div class="hsc">
          <div>
            ${sc(formScore!=null?formScore:ssnScore,true)}
            <div class="scl">${formScore!=null?'🔥 Form HR':'📅 Ssn HR'}</div>
          </div>
          ${formScore!=null?`<div>${sc(ssnScore)}<div class="scl">📅 Ssn HR</div></div>`:''}
          <div>${sc(h.hs_l14??h.hs_blend??h.hs_season)}<div class="scl">${h.hs_l14!=null?'L14 HS':'Ssn HS'}</div></div>
          ${h.hConf!=null?`<div style="margin-top:2px">${cb(h.hConf)}</div>`:''}
        </div>
      </div>
      ${isOpen?`<div class="det">${renderDetail(h)}</div>`:''}`;
  }).join('');
}

/* ══════════════════════════════════════════════════════════
   DETAIL PANEL
══════════════════════════════════════════════════════════ */
function toggleH(id){S.openId=S.openId===id?null:id;if(!S.openTab[id])S.openTab[id]='stats';renderHitters();}
function setDTab(id,tab,ev){ev.stopPropagation();S.openTab[id]=tab;renderHitters();}

function renderDetail(h){
  const tab=S.openTab[h.id]||'stats';
  const spHand=S.team==='away'?S.pHands.home:S.pHands.away;
  const tabs=`<div class="dtabs" onclick="event.stopPropagation()">
    <button class="dt${tab==='stats'?' on':''}" onclick="setDTab('${h.id}','stats',event)">Stats</button>
    <button class="dt${tab==='pitch'?' on':''}" onclick="setDTab('${h.id}','pitch',event)">vs Mix</button>
    <button class="dt${tab==='platoon'?' on':''}" onclick="setDTab('${h.id}','platoon',event)">Platoon</button>
  </div>`;
  if(tab==='stats')return tabs+statsTab(h,spHand);
  if(tab==='pitch')return tabs+pitchTab(h);
  if(tab==='platoon')return tabs+platoonTab(h,spHand);
  return tabs;
}

        ${h.l14_hard!=null?`<div class="l14i"><span class="l14v">${hcp(h.l14_hard,30,55)}</span><span class="l14k">HARD%</span></div>`:''}
        ${h.l14_ev!=null?`<div class="l14i"><span class="l14v">${hcv(h.l14_ev,86,95)}</span><span class="l14k">EV</span></div>`:''}
        ${h.l14_la!=null?`<div class="l14i"><span class="l14v">${hc(h.l14_la,8,18,true,1,'°')}</span><span class="l14k">LA° display</span></div>`:''}
        ${h.l14_woba!=null?`<div class="l14i"><span class="l14v">${hcn(h.l14_woba,.290,.390)}</span><span class="l14k">wOBA</span></div>`:''}

      </div>
    </div>`:'<div style="font-size:.7rem;color:var(--t4);margin-bottom:8px">L14 data loading…</div>';

  // Season stats
  const sr=[
    ['AVG',h.avg,.215,.300,true,3,''],['OBP',h.obp,.305,.385,true,3,''],
    ['SLG',h.slg,.340,.520,true,3,''],['OPS',h.ops,.700,.900,true,3,''],
    ['HR',h.hr,3,35,true,0,''],
    ['Barrel%',h.barrel_pct,4,15,true,1,'%'],['Hard Hit%',h.hard_hit_pct,30,55,true,1,'%'],
    ['Exit Velo',h.avg_ev,86,95,true,1,' mph'],['Launch°',h.avg_la,8,18,true,1,'°'],

  const pr_used=pr_l14!=null?pr_l14:pr_s;
  const pf=PARK[S.team==='away'?S.game?.home:S.game?.away]||1.00;
  const ws=S.weather?wxS(S.weather):50;
  const pConf=calcPConf(pRow);

  const bkd=`
    <div class="scbkd">
      <div class="scbt">🔥 Form HR Breakdown</div>
      <div class="scr"><span class="scrl">Form HR Score</span>${sc(h.hrFormScore,true)}</div>
      <div class="scr"><span class="scrl">⚾ Pitcher Risk ${L14B} <span class="scrw">28%</span></span>${rpill(pr_used)} ${cb(pConf)}${pr_l14!=null?` <span style="font-size:.6rem;color:var(--amber)">L14</span>`:` <span style="font-size:.6rem;color:var(--t4)">season</span>`}</div>
      <div class="scr"><span class="scrl">🏏 Hitter ${L14B} <span class="scrw">22%</span></span>${sc(h.hs_l14??h.hs_season)} ${cb(h.hConf)}</div>
      <div class="scr"><span class="scrl">🏟️ Park <span class="scrw">5%</span></span><span style="font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--t2)">${pf.toFixed(2)}×</span></div>
      <div class="scr"><span class="scrl">☀️ Weather <span class="scrw">2%</span></span><span style="font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--t2)">${Math.round(ws)}/100</span></div>
    </div>
    <div class="scbkd" style="margin-top:6px;background:rgba(61,142,240,.06);border-color:rgba(61,142,240,.18)">
      <div class="scbt" style="color:var(--blue)">📅 Season HR Breakdown</div>
      <div class="scr"><span class="scrl">Season HR Score</span>${sc(h.hrScore,true)}</div>
      <div class="scr"><span class="scrl">⚾ Pitcher Risk <span class="scrw">28%</span></span>${rpill(pr_s)} ${cb(pConf)}</div>
      <div class="scr"><span class="scrl">🏏 Hitter Quality <span class="scrw">22%</span></span>${sc(h.hs_blend??h.hs_season)} ${cb(h.hConf)}</div>
      <div class="scr"><span class="scrl">🏟️ Park <span class="scrw">5%</span></span><span style="font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--t2)">${pf.toFixed(2)}×</span></div>
      <div class="scr"><span class="scrl">☀️ Weather <span class="scrw">2%</span></span><span style="font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--t2)">${Math.round(ws)}/100</span></div>
    </div>`;

  return hrBoxes + hsBoxes + l14Html +
    `<div class="slbl" style="padding:0 0 5px;font-size:.59rem">Season Stats</div>${sr}${bkd}`;
}

function pitchTab(h){
  const ar=h.arsenal||{};const sp=h.pitchSplits||{};
  const pts=Object.entries(ar).sort((a,b)=>b[1]-a[1]);
  if(!pts.length)return`<div class="empty">No arsenal data</div>`;
  const trows=pts.map(([pt,pct])=>{
    const nm=PN[pt]||pt;const cl=PC[pt]||'#607080';const hvp=sp[pt]||{};const bw=Math.min(40,Math.round(pct*.4));
    return`<tr><td><span style="color:${cl};font-weight:700">${nm}</span></td>
      <td><span class="ub" style="width:${bw}px;background:${cl}80"></span>${pct.toFixed(0)}%</td>
      <td>${hcp(hvp.brl_pct,4,15)}</td><td>${hcp(hvp.hard_pct,30,55)}</td>
      <td>${hcv(hvp.avg_ev,86,95)}</td><td>${hc(hvp.avg_la,8,18,true,1,'°')}</td>
      <td>${hcn(hvp.woba,.280,.400)}</td></tr>`;
  }).join('');
  const pm=calcPM(sp,ar);
  return`<div style="font-size:.65rem;color:var(--t4);margin-bottom:5px">Usage % · Stats vs pitch type (hitter league-wide)</div>
    <table class="ptbl"><thead><tr><th>Pitch</th><th>Use%</th><th>BRL%</th><th>HH%</th><th>EV</th><th>LA</th><th>wOBA</th></tr></thead><tbody>${trows}</tbody></table>
    <div style="margin-top:8px;background:rgba(61,142,240,.07);border:1px solid rgba(61,142,240,.2);border-radius:7px;padding:8px 10px">
      <div style="font-size:.6rem;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Weighted vs Arsenal</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div style="text-align:center"><span style="display:block">${hcn(pm.woba,.290,.390)}</span><span style="font-size:.55rem;color:var(--t4)">wOBA</span></div>
        <div style="text-align:center"><span style="display:block">${hcp(pm.brl_pct,4,15)}</span><span style="font-size:.55rem;color:var(--t4)">BRL%</span></div>
        <div style="text-align:center"><span style="display:block">${hcp(pm.hard_pct,30,55)}</span><span style="font-size:.55rem;color:var(--t4)">HARD%</span></div>
        <div style="text-align:center"><span style="display:block">${hcv(pm.avg_ev,86,95)}</span><span style="font-size:.55rem;color:var(--t4)">EV</span></div>
      </div>
    </div>`;
}

function platoonTab(h,spHand){
  const pl=h.platoon||{};
  if(!pl.R&&!pl.L)return`<div class="empty">Platoon data needs Streamlit backend</div>`;
  const rows=['R','L'].map(hand=>{const sp=pl[hand]||{};const hl=hand===spHand?'plt-hl':'';const st=hand===spHand?'★ ':'';
    return`<tr class="${hl}"><td>${st}${hand==='R'?'vs RHP':'vs LHP'}</td><td>${sp.pa??'—'}</td><td>${sp.hr??'—'}</td><td>${hcn(sp.ba,.215,.305)}</td><td>${hcn(sp.obp,.305,.385)}</td><td>${hcn(sp.slg,.320,.520)}</td><td>${hcn(sp.woba,.290,.390)}</td></tr>`;
  }).join('');
  return`<table class="pltbl"><thead><tr><th>Split</th><th>PA</th><th>HR</th><th>AVG</th><th>OBP</th><th>SLG</th><th>wOBA</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="font-size:.64rem;color:var(--t4);margin-top:7px">★ = today's matchup</div>`;
}

/* ══════════════════════════════════════════════════════════
   PITCHERS PAGE
══════════════════════════════════════════════════════════ */
function renderPitchers(){
  const g=S.game;if(!g){document.getElementById('pitchersContent').innerHTML='<div class="empty">Select a game on the Slate tab</div>';return;}
  const sps=[
    {name:g.homeSpName,hand:S.pHands.home,pRow:S.pRows.away,pl14:S.pL14.away,arsenal:S.arsenals.away,faces:g.away},
    {name:g.awaySpName,hand:S.pHands.away,pRow:S.pRows.home,pl14:S.pL14.home,arsenal:S.arsenals.home,faces:g.home},
  ];
  document.getElementById('pitchersContent').innerHTML=sps.map(sp=>{
    const pr_s=calcPR_Season(sp.pRow);const pr_l14=calcPR_L14(sp.pl14);
    const pr_used=pr_l14!=null?pr_l14:pr_s;
    const conf=calcPConf(sp.pRow);const p=sp.pRow||{};
    const hasD=Object.values(p).some(v=>v!=null);
    const avgN=hasD?'':`<span style="font-size:.61rem;color:var(--amber)">★ lg avg</span>`;
    const l14N=pr_l14!=null?`<span class="l14r">🔥 L14: ${pr_l14} · Brl: ${fmt(sp.pl14?.l14_brl,1,'%')} HH: ${fmt(sp.pl14?.l14_hard,1,'%')}</span>`:'';

    const riskBoxes=`
      <div style="display:flex;gap:8px;margin:8px 0 10px">
        <div style="flex:1;background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.25);border-radius:7px;padding:7px 9px">
          <div style="font-size:.57rem;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">L14 Risk ${L14B}</div>
          <div style="font-size:1.1rem;font-weight:800;color:${scColor(pr_l14)}">${pr_l14!=null?pr_l14:'—'}</div>
          <div style="font-size:.58rem;color:var(--t4);margin-top:2px">Brl+Hard allowed</div>
        </div>
        <div style="flex:1;background:rgba(61,142,240,.07);border:1px solid rgba(61,142,240,.2);border-radius:7px;padding:7px 9px">
          <div style="font-size:.57rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">Season Risk</div>
          <div style="font-size:1.1rem;font-weight:800;color:${scColor(pr_s)}">${pr_s!=null?pr_s:'—'}</div>
          <div style="font-size:.58rem;color:var(--t4);margin-top:2px">${hasD?'Season stats':'League avg'}</div>
        </div>
      </div>`;

    const srRows=[
      ['Barrel% allow','p_brl_pct',2,14,true,1,'%'],
      ['HR/FB%','p_hr_per_fb',5,20,true,1,'%'],
      ['Hard Hit% allow','p_hard_hit_pct',28,50,true,1,'%'],
      ['K%','p_k_pct',14,35,false,1,'%'],
      ['BB%','p_bb_pct',4,12,true,1,'%'],
      ['FB% allow','p_fb_pct',20,48,true,1,'%'],
      ['EV allowed','p_avg_ev',82,93,true,1,' mph'],
      ['ERA','era',2,5,false,2,''],
      ['FIP','fip',2,5,false,2,''],
    ].map(([l,c,lo,hi,hib,dec,su])=>
      `<div class="srow"><span class="slb">${l}</span>${hc(p[c],lo,hi,hib,dec,su)}</div>`
    ).join('');

    const arsHtml=Object.entries(sp.arsenal).sort((a,b)=>b[1]-a[1]).map(([pt,pct])=>{
      const c=PC[pt]||'#607080';const nm=PN[pt]||pt;const bw=Math.min(100,Math.round(pct));
      return`<div style="margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;font-size:.76rem;margin-bottom:3px">
          <span style="color:${c};font-weight:700">${nm}</span>
          <span style="font-family:'JetBrains Mono',monospace;color:var(--t2)">${pct.toFixed(1)}%</span>
        </div>
        <div style="background:var(--bdr);border-radius:2px;height:4px">
          <div style="background:${c};width:${bw}%;height:4px;border-radius:2px"></div>
        </div></div>`;
    }).join('')||`<span style="color:var(--t4);font-size:.72rem">No arsenal data</span>`;

    return`<div class="spbd">
      <div class="spbh">
        <div style="font-weight:700;font-size:.98rem;color:var(--t1);flex:1">⚾ ${sp.name}</div>
        <span style="font-size:.65rem;color:var(--t3)">${sp.hand==='L'?'LHP':'RHP'} · vs ${sp.faces}</span>
        ${rpill(pr_used)} ${avgN} ${cb(conf)} ${l14N}
      </div>
      <div class="spbb">
        ${riskBoxes}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div><div class="slbl" style="padding:0 0 7px;font-size:.59rem">Season Profile</div>${srRows}</div>
          <div><div class="slbl" style="padding:0 0 7px;font-size:.59rem">Arsenal</div>${arsHtml}</div>
        </div>
      </div></div>`;
  }).join('');
}

/* ══════════════════════════════════════════════════════════
   AB EXPLORER
══════════════════════════════════════════════════════════ */
function initAB(){
  if(!S.game){document.getElementById('abFilter').innerHTML='';document.getElementById('abSummary').innerHTML='';document.getElementById('abContent').innerHTML='<div class="empty">Select a game on the Slate tab first</div>';return;}
  renderABFilter();
}
function renderABFilter(){
  const allH=[...S.hitters.away,...S.hitters.home];
  if(!allH.length){document.getElementById('abFilter').innerHTML='<div style="padding:8px;color:var(--t4);font-size:.78rem">Hitters still loading…</div>';return;}
  if(!S.abBatter){
    S.abBatter=allH[0];
    const inAway=!!S.hitters.away.find(h=>h.id===allH[0].id);
    const oppArs=inAway?S.arsenals.away:S.arsenals.home;
    const oppH=inAway?S.pHands.home:S.pHands.away;
    S.abPitchTypes=Object.keys(oppArs).sort((a,b)=>oppArs[b]-oppArs[a]);
    S.abArm=oppH;
  }
  const oppArsFull=S.hitters.away.find(h=>h.id===S.abBatter.id)?S.arsenals.away:S.arsenals.home;
  document.getElementById('abFilter').innerHTML=`
    <div class="abf-row">
      <label>Batter</label>
      <select onchange="onABChange(this.value)" style="flex:2">
        ${allH.map(h=>`<option value="${h.id}"${h.id===S.abBatter.id?' selected':''}>${h.name}</option>`).join('')}
      </select>
    </div>
    <div class="abf-row">
      <label>Last ABs</label>
      <select onchange="S.abCount=+this.value;runAB()" style="flex:1">
        ${[10,15,20,30].map(n=>`<option${n===S.abCount?' selected':''}>${n}</option>`).join('')}
        <option value="999"${S.abCount===999?' selected':''}>All</option>
      </select>
      <label style="min-width:36px">Arm</label>
      <select onchange="S.abArm=this.value;runAB()" style="flex:1">
        ${['Both','R','L'].map(a=>`<option value="${a}"${a===S.abArm?' selected':''}>${a==='R'?'RHP':a==='L'?'LHP':a}</option>`).join('')}
      </select>
    </div>
    <div class="abf-row">
      <label>Pitches</label>
      <div style="display:flex;flex-wrap:wrap;gap:3px;flex:1" id="ptWrap">
        <button class="ptag${!S.abPitchTypes.length?' on':''}" onclick="clearPTypes()">All</button>
        ${Object.entries(PN).map(([k,v])=>`<button class="ptag${S.abPitchTypes.includes(k)?' on':''}" onclick="togglePType('${k}')">${v}</button>`).join('')}
      </div>
    </div>
    <div style="font-size:.62rem;color:var(--t4);padding-top:2px">
      ${Object.entries(oppArsFull).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span style="color:${PC[k]||'#607080'};font-weight:600">${PN[k]||k} ${v.toFixed(0)}%</span>`).join(' · ')||''}
    </div>`;
  runAB();
}
function onABChange(id){
  const all=[...S.hitters.away,...S.hitters.home];
  S.abBatter=all.find(h=>String(h.id)===String(id));
  const inAway=!!S.hitters.away.find(h=>String(h.id)===String(id));
  const oppArs=inAway?S.arsenals.away:S.arsenals.home;
  S.abArm=inAway?S.pHands.home:S.pHands.away;
  S.abPitchTypes=Object.keys(oppArs).sort((a,b)=>oppArs[b]-oppArs[a]);
  renderABFilter();
}
function togglePType(pt){const i=S.abPitchTypes.indexOf(pt);if(i>=0)S.abPitchTypes.splice(i,1);else S.abPitchTypes.push(pt);renderABFilter();}
function clearPTypes(){S.abPitchTypes=[];renderABFilter();}

async function runAB(){
  if(!S.abBatter){document.getElementById('abContent').innerHTML='<div class="empty">Select a batter</div>';return;}
  document.getElementById('abContent').innerHTML='<div class="ldr"><div class="spin"></div><br>Loading at-bats…</div>';
  const arm=S.abArm==='Both'?null:S.abArm;
  const pts=S.abPitchTypes.length?S.abPitchTypes:null;
  let rows=await getABLog(S.abBatter.id,2026,arm,pts);
  if(!rows.length)rows=await getABLog(S.abBatter.id,2025,arm,pts);
  if(!rows.length){
    document.getElementById('abSummary').innerHTML='';
    document.getElementById('abContent').innerHTML='<div class="empty">No at-bats found for these filters</div>';
    return;
  }
  S.abRows=rows.slice(0,S.abCount===999?9999:S.abCount);
  renderABResults();
}
function renderABResults(){
  const rows=S.abRows;if(!rows.length)return;
  const evs=rows.filter(r=>r.ev!=null).map(r=>r.ev);
  const hrs=rows.filter(r=>r.isHR).length;
  const brls=rows.filter(r=>r.isBrl).length;
  const avgEV=evs.length?evs.reduce((a,b)=>a+b)/evs.length:null;
  const brlPct=evs.length?brls/evs.length*100:null;
  const hardPct=evs.length?evs.filter(e=>e>=95).length/evs.length*100:null;
  document.getElementById('abSummary').innerHTML=`<div class="ab-sum">
    <div class="asb"><span class="asv">${rows.length}</span><span class="ask">ABs</span></div>
    <div class="asb"><span class="asv">${avgEV?hcv(avgEV,86,95):'<span class="hc hcn">—</span>'}</span><span class="ask">Avg EV</span></div>
    <div class="asb"><span class="asv">${brlPct!=null?hcp(brlPct,4,15):'<span class="hc hcn">—</span>'}</span><span class="ask">BRL%</span></div>
    <div class="asb"><span class="asv">${hardPct!=null?hcp(hardPct,30,55):'<span class="hc hcn">—</span>'}</span><span class="ask">Hard%</span></div>
    <div class="asb"><span class="asv" style="font-family:'JetBrains Mono',monospace;font-weight:700;color:${hrs>0?'var(--y-tx)':'var(--t4)'}">${hrs}</span><span class="ask">HRs</span></div>
    <div class="asb"><span class="asv" style="font-family:'JetBrains Mono',monospace;font-weight:700;color:${brls>0?'var(--g-tx)':'var(--t4)'}">${brls}</span><span class="ask">Barrels</span></div>
  </div>`;
  const tbody=rows.map(r=>{
    const rc=r.isHR?'ab-hr':r.isBrl?'ab-brl':'';
    const evCls=r.ev==null?'':(r.ev>=95?'ev-h':r.ev>=85?'ev-m':'ev-l');
    const ptCl=PC[r.pt]||'#607080';
    let tag='';
    if(r.isHR)tag=`<span class="tag tag-hr">💥 HR</span>`;
    else if(['single','double','triple'].some(x=>r.evt.includes(x)))tag=`<span class="tag tag-hit">${r.evt.slice(0,3)}</span>`;
    else if(r.evt.includes('strikeout'))tag=`<span class="tag tag-k">K</span>`;
    else tag=`<span class="tag tag-out">${r.evt.slice(0,5)}</span>`;
    return`<tr class="${rc}">
      <td style="color:var(--t3)">${r.date}</td>
      <td style="font-size:.68rem;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(r.pitcher||'').split(',').reverse().join(' ').trim()}</td>
      <td><span style="color:${ptCl};font-weight:700;font-size:.7rem">${r.ptNm||'—'}</span></td>
      <td><span class="${evCls}">${r.ev!=null?r.ev.toFixed(1):'—'}</span>${r.isBrl?'<span style="color:var(--g-tx);font-size:.6rem">●</span>':''}</td>
      <td>${r.la!=null?r.la.toFixed(1)+'°':'—'}</td>
      <td>${r.dist!=null?r.dist:'—'}</td>
      <td>${r.velo!=null?r.velo.toFixed(1):'—'}</td>
      <td>${tag}</td>
      <td style="font-size:.67rem;color:${r.hrPk==='HR'||r.hrPk!=='0/30'?'var(--g-tx)':'var(--t4)'}">${r.hrPk}</td>
    </tr>`;
  }).join('');
  document.getElementById('abContent').innerHTML=`
    <div style="overflow-x:auto;padding:0 14px">
    <table class="abtbl"><thead><tr>
      <th>Date</th><th>Pitcher</th><th>Pitch</th><th>EV</th><th>LA</th><th>Dist</th><th>Velo</th><th>Result</th><th>HR Parks</th>
    </tr></thead><tbody>${tbody}</tbody></table></div>
    <div style="font-size:.62rem;color:var(--t4);padding:5px 14px">🟡 HR · 🟢 Barrel · EV green ≥95 · LA display only</div>`;
}

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
prewarm();
loadSlate();
</script>
