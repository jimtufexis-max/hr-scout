<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HR Scout">
<meta name="theme-color" content="#0a0f1e">
<title>HR Scout ⚾</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1e;--bg2:#0f172a;--surf:#1a2235;--surf2:#1e2d42;
  --bdr:#2a3a52;--bdr2:#344560;--accent:#f59e0b;--blue:#3b82f6;
  --text:#e8edf5;--muted:#7a8fa8;
  --safe-t:env(safe-area-inset-top,44px);
  --safe-b:env(safe-area-inset-bottom,20px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:-webkit-fill-available}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;
  min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;
  padding-bottom:calc(60px + var(--safe-b))}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:200;background:var(--bg);
  border-bottom:1px solid var(--bdr);
  padding:calc(var(--safe-t) + 6px) 16px 10px;
  display:flex;align-items:center;gap:10px}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.35rem;
  letter-spacing:.02em;color:var(--accent);flex:1}
.logo span{color:var(--text)}
.date-pill{display:flex;align-items:center;background:var(--surf);
  border:1px solid var(--bdr);border-radius:8px;overflow:hidden}
.darr{background:none;border:none;color:var(--muted);font-size:1rem;
  padding:6px 10px;cursor:pointer;transition:color .15s}
.darr:active{color:var(--accent)}
.dtxt{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--text);
  min-width:74px;text-align:center;padding:0 4px}

/* BOTTOM NAV */
.botnav{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--bg);border-top:1px solid var(--bdr);
  display:flex;padding-bottom:var(--safe-b)}
.navbtn{flex:1;border:none;background:none;color:var(--muted);
  font-size:.64rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:9px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;transition:color .15s}
.navbtn .ni{font-size:1.2rem}
.navbtn.active{color:var(--accent)}

/* PAGES */
.page{display:none}.page.active{display:block}
.sec-lbl{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;font-weight:700;
  letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:12px 16px 5px}

/* GAME CHIPS — wrapping grid, up to 4 per row on mobile */
.game-grid{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 10px}
.gchip{flex:1;min-width:calc(25% - 6px);max-width:calc(50% - 6px);
  background:var(--surf);border:1.5px solid var(--bdr);border-radius:9px;
  padding:8px 10px;cursor:pointer;text-align:center;transition:all .15s}
.gchip:active{transform:scale(.97)}
.gchip.sel{border-color:var(--accent);background:rgba(245,158,11,.08)}
.gchip-teams{font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:.88rem;color:var(--text);white-space:nowrap}
.gchip.sel .gchip-teams{color:var(--accent)}
.gchip-time{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);margin-top:2px}

/* WEATHER */
.wx-strip{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.wx-strip::-webkit-scrollbar{display:none}
.wchip{flex-shrink:0;background:var(--surf);border:1px solid var(--bdr);
  border-radius:8px;padding:5px 10px;text-align:center}
.wv{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--text);font-weight:500;display:block}
.wl{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-top:1px}

/* PITCHER CARD */
.sp-card{margin:0 16px 10px;background:var(--surf);
  border:1px solid var(--bdr);border-left:3px solid var(--accent);
  border-radius:10px;padding:11px 13px}
.sp-head{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.sp-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;flex:1}
.sp-hand{font-size:.68rem;color:var(--muted);background:var(--surf2);
  border-radius:4px;padding:2px 6px}
.sp-stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sp-stat{background:var(--surf2);border-radius:6px;padding:4px 8px;text-align:center;min-width:44px}
.sp-v{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:500;color:var(--text);display:block}
.sp-l{font-size:.57rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block}
.ars-wrap{display:flex;flex-wrap:wrap;gap:4px}
.ac{font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid}

/* TEAM TOGGLE */
.team-tog{display:flex;margin:0 16px 8px;background:var(--surf);
  border-radius:8px;padding:3px;gap:3px}
.team-btn{flex:1;border:none;background:none;color:var(--muted);
  font-weight:700;font-size:.82rem;padding:7px 4px;border-radius:6px;
  cursor:pointer;transition:all .15s;font-family:'Barlow Condensed',sans-serif;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-btn.active{background:var(--blue);color:white}

/* SORT */
.sort-strip{display:flex;gap:5px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.sort-strip::-webkit-scrollbar{display:none}
.sort-btn{flex-shrink:0;font-size:.67rem;font-weight:600;padding:5px 10px;
  border-radius:99px;border:1px solid var(--bdr);background:var(--surf);
  color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.sort-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(245,158,11,.08)}

/* HITTER ROWS */
.h-wrap{padding:0 16px}
.h-row{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 12px;margin-bottom:7px;cursor:pointer;
  display:flex;align-items:center;gap:9px;transition:border-color .15s;
  -webkit-user-select:none;user-select:none}
.h-row:active{transform:scale(.98)}
.h-row.open{border-color:var(--blue);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.h-rank{font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:1.05rem;color:var(--muted);min-width:22px;text-align:center}
.r1{color:#f59e0b}.r2{color:#94a3b8}.r3{color:#b45309}
.h-info{flex:1;min-width:0}
.h-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-sub{font-size:.68rem;color:var(--muted);margin-top:1px}
.h-minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.mtag{font-family:'DM Mono',monospace;font-size:.66rem;padding:2px 5px;border-radius:4px}
.h-sc{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sc-badge{font-family:'DM Mono',monospace;font-size:.95rem;font-weight:500;
  padding:3px 9px;border-radius:7px;min-width:40px;text-align:center}
.sc-lbl{font-size:.58rem;color:var(--muted)}

/* DETAIL PANEL */
.det-panel{background:var(--surf2);border:1px solid var(--blue);
  border-top:none;border-radius:0 0 10px 10px;padding:12px;margin-bottom:7px}
.dtabs{display:flex;gap:3px;background:var(--surf);
  border-radius:7px;padding:3px;margin-bottom:10px}
.dtab{flex:1;border:none;background:none;color:var(--muted);font-size:.7rem;
  font-weight:600;padding:6px 3px;border-radius:5px;cursor:pointer;
  transition:all .15s;text-transform:uppercase;letter-spacing:.04em}
.dtab.active{background:var(--blue);color:white}

/* HEAT CELLS */
.hc{font-family:'DM Mono',monospace;font-size:.75rem;font-weight:500;
  padding:2px 8px;border-radius:5px;text-align:center;min-width:52px;display:inline-block}
.hcg{background:rgba(34,197,94,.15);color:#4ade80}
.hcy{background:rgba(234,179,8,.15);color:#fbbf24}
.hcr{background:rgba(239,68,68,.15);color:#f87171}
.hcn{background:rgba(100,116,139,.12);color:#64748b}

/* PILLS */
.pill{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;
  padding:2px 9px;border-radius:99px;border:1px solid;display:inline-block}
.pill-g{background:rgba(34,197,94,.12);color:#22c55e;border-color:rgba(34,197,94,.3)}
.pill-y{background:rgba(234,179,8,.12);color:#eab308;border-color:rgba(234,179,8,.3)}
.pill-r{background:rgba(239,68,68,.12);color:#ef4444;border-color:rgba(239,68,68,.3)}
.pill-b{background:rgba(59,130,246,.12);color:#3b82f6;border-color:rgba(59,130,246,.3)}

/* STAT ROWS */
.srow{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid rgba(42,58,82,.8);font-size:.8rem}
.srow:last-child{border-bottom:none}
.srow-lbl{color:var(--muted);font-size:.76rem}

/* PITCH TABLE */
.ptbl{width:100%;border-collapse:collapse;font-size:.74rem;margin-top:4px}
.ptbl th{color:var(--muted);font-size:.59rem;text-transform:uppercase;
  letter-spacing:.05em;padding:4px 3px;text-align:center;border-bottom:1px solid var(--bdr)}
.ptbl th:first-child{text-align:left}
.ptbl td{padding:5px 3px;text-align:center;border-bottom:1px solid rgba(42,58,82,.6)}
.ptbl td:first-child{text-align:left;font-weight:600}
.ptbl tr:last-child td{border-bottom:none}
.ubar{height:6px;border-radius:3px;display:inline-block;vertical-align:middle}

/* PLATOON TABLE */
.plat-tbl{width:100%;border-collapse:collapse;font-size:.74rem;margin-top:4px}
.plat-tbl th{color:var(--muted);font-size:.59rem;text-transform:uppercase;
  letter-spacing:.05em;padding:4px 3px;text-align:center;border-bottom:1px solid var(--bdr)}
.plat-tbl th:first-child{text-align:left}
.plat-tbl td{padding:5px 3px;text-align:center;border-bottom:1px solid rgba(42,58,82,.6);
  font-family:'DM Mono',monospace}
.plat-tbl td:first-child{text-align:left;font-weight:600;font-family:'Barlow',sans-serif}
.plat-hl{background:rgba(34,197,94,.06)}

/* COMPOSITE */
.comp-box{background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.2);
  border-radius:8px;padding:8px 10px;margin-top:8px}
.comp-lbl{font-size:.61rem;font-weight:700;color:var(--blue);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.comp-grid{display:flex;gap:8px;flex-wrap:wrap}
.comp-item{text-align:center}
.comp-val{font-family:'DM Mono',monospace;font-size:.8rem;display:block}
.comp-key{font-size:.57rem;color:var(--muted);display:block;margin-top:1px}

/* SCORE BREAKDOWN */
.sc-bkd{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);
  border-radius:8px;padding:8px 10px;margin-top:8px;
  font-size:.72rem;color:var(--muted);line-height:1.9}
.sc-bkd strong{color:var(--text)}

/* PITCHER PAGE */
.sp-bd{margin:0 16px 10px;background:var(--surf);
  border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.sp-bd-head{background:var(--surf2);padding:11px 13px;
  display:flex;align-items:center;gap:8px}
.sp-bd-body{padding:12px 13px}

/* LOADERS */
.loader{text-align:center;padding:40px 20px;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--bdr);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:30px 20px;color:var(--muted);font-size:.85rem;line-height:1.5}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">HR <span>Scout</span> ⚾</div>
  <div class="date-pill">
    <button class="darr" onclick="shiftDate(-1)">‹</button>
    <div class="dtxt" id="dateTxt">—</div>
    <button class="darr" onclick="shiftDate(1)">›</button>
  </div>
</div>

<div class="page active" id="pg-slate">
  <div class="sec-lbl">Games</div>
  <div class="game-grid" id="gameGrid"><div class="loader"><div class="spin"></div><br>Loading…</div></div>
  <div class="wx-strip" id="wxBar"></div>
  <div id="spArea"></div>
  <div class="team-tog" id="teamTog" style="display:none">
    <button class="team-btn active" id="btnAway" onclick="setTeam('away')">—</button>
    <button class="team-btn" id="btnHome" onclick="setTeam('home')">—</button>
  </div>
  <div class="sort-strip" id="sortStrip"></div>
  <div class="h-wrap" id="hList"><div class="empty">Select a game above</div></div>
</div>

<div class="page" id="pg-pitchers">
  <div class="sec-lbl">Starting Pitchers</div>
  <div id="spBd"><div class="empty">Select a game on the Slate tab</div></div>
</div>

<div class="botnav">
  <button class="navbtn active" id="nav-slate" onclick="goPage('slate',this)">
    <span class="ni">📋</span>Slate
  </button>
  <button class="navbtn" id="nav-pitchers" onclick="goPage('pitchers',this)">
    <span class="ni">⚾</span>Pitchers
  </button>
</div>

<script>
'use strict';

/* ═══ CONSTANTS ═══════════════════════════════════════════════════════ */
const PARK={COL:1.18,CIN:1.10,PHI:1.09,BOS:1.08,NYY:1.07,MIL:1.05,HOU:1.04,ATL:1.04,
  CHC:1.03,TEX:1.03,LAD:1.02,STL:1.01,ARI:1.01,MIN:1.00,TOR:1.00,DET:1.00,
  WSH:0.99,MIA:0.98,NYM:0.98,ATH:0.97,SEA:0.97,SFG:0.96,SF:0.96,PIT:0.96,
  CLE:0.96,BAL:0.95,TBR:0.95,TB:0.95,KCR:0.95,KC:0.95,LAA:0.94,CHW:0.94,
  SDP:0.93,SD:0.93,OAK:0.97};
const PITCH_NAMES={FF:'4-Seam',SI:'Sinker',FC:'Cutter',SL:'Slider',CU:'Curve',
  CH:'Change',FS:'Split',KC:'KnuckleCrv',ST:'Sweeper',SV:'Slurve',KN:'Knuckle'};
const PITCH_CLR={FF:'#dc2626',SI:'#b91c1c',FC:'#ea580c',SL:'#2563eb',ST:'#1d4ed8',
  SV:'#0891b2',CU:'#7c3aed',KC:'#6d28d9',CH:'#16a34a',FS:'#15803d',KN:'#6b7280'};
const COORDS={
  'Yankee Stadium':[40.83,-73.93],'Fenway Park':[42.35,-71.10],
  'Wrigley Field':[41.95,-87.66],'Dodger Stadium':[34.07,-118.24],
  'Coors Field':[39.76,-104.99],'Oracle Park':[37.78,-122.39],
  'Globe Life Field':[32.75,-97.08],'Truist Park':[33.89,-84.47],
  'Citizens Bank Park':[39.91,-75.17],'Busch Stadium':[38.62,-90.19],
  'American Family Field':[43.03,-87.97],'Petco Park':[32.71,-117.16],
  'Chase Field':[33.45,-112.07],'T-Mobile Park':[47.59,-122.33],
  'Target Field':[44.98,-93.28],'Progressive Field':[41.50,-81.69],
  'Comerica Park':[42.34,-83.05],'Kauffman Stadium':[39.05,-94.48],
  'Minute Maid Park':[29.76,-95.36],'Angel Stadium':[33.80,-117.88],
  'Nationals Park':[38.87,-77.01],'PNC Park':[40.45,-80.01],
  'Citi Field':[40.76,-73.85],'Camden Yards':[39.28,-76.62],
  'Great American Ball Park':[39.10,-84.51],'loanDepot park':[25.78,-80.22]
};
const MLB='https://statsapi.mlb.com/api/v1';
const PROXIES=[
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://proxy.cors.sh/${u}`,
];

/* ═══ STATE ═══════════════════════════════════════════════════════════ */
const S={
  date:new Date(), games:[], game:null,
  team:'away', sort:'hrScore',
  hitters:{away:[],home:[]},
  pRows:{away:null,home:null},
  arsenals:{away:{},home:{}},
  pHands:{away:'R',home:'R'},
  weather:null, openId:null, openTab:{},
};
const _statCache={};
let _savBatCache=null, _savPitCache=null;

/* ═══ SCORING — mirrors Python app exactly ═══════════════════════════ */
function scaleScore(v,lo,hi,hib){
  if(v==null) return null;
  v=Math.max(lo,Math.min(hi,v));
  const r=hi===lo?.5:(v-lo)/(hi-lo);
  return hib?r*100:(1-r)*100;
}

// Hitter Score: barrel%(28), hard hit%(22), EV(18), LA(8), sweet spot%(8), FB%(7), pull%(5), K%(4)
function calcHitterScore(r){
  const M=[['barrel_pct',3,18,true,28],['hard_hit_pct',30,55,true,22],
    ['avg_ev',86,95,true,18],['avg_la',8,18,true,8],
    ['sweet_spot_pct',25,42,true,8],['fb_pct',22,45,true,7],
    ['pull_pct',28,50,true,5],['k_pct',6,30,false,4]];
  let tw=0,ts=0;
  for(const[c,lo,hi,hib,w]of M){const v=r[c];if(v==null)continue;
    const s=scaleScore(v,lo,hi,hib);if(s!=null){ts+=s*w;tw+=w;}}
  return tw>=40?Math.round(ts/tw):null;
}

// Pitcher Risk: barrel%allowed(30), HR/FB(25), hard hit%(20), K%(15), FB%(7), EV(3)
// Uses MLB league averages as fallback when data missing
const MLB_AVG={brl_pct:6.5,hr_per_fb:12.0,hard_hit_pct:37.0,k_pct:22.0,fb_pct:35.0,avg_ev:88.0};
function calcPitcherRisk(p){
  const M=[['brl_pct',2,14,true,30],['hr_per_fb',5,20,true,25],
    ['hard_hit_pct',28,50,true,20],['k_pct',14,35,false,15],
    ['fb_pct',20,50,true,7],['avg_ev',82,93,true,3]];
  let tw=0,ts=0;
  for(const[c,lo,hi,hib,w]of M){
    const v=(p&&p[c]!=null)?p[c]:MLB_AVG[c]; // league avg fallback
    const s=scaleScore(v,lo,hi,hib);if(s!=null){ts+=s*w;tw+=w;}}
  return tw>0?Math.round(ts/tw):50;
}

function calcPMComposite(splits,arsenal){
  const keys=['woba','xwoba','brl_pct','hard_pct','avg_ev','avg_la','whiff_pct'];
  const tw=Object.values(arsenal).reduce((a,b)=>a+b,0);if(!tw)return{};
  const acc={},wts={};for(const k of keys){acc[k]=0;wts[k]=0;}
  for(const[pt,pct]of Object.entries(arsenal)){
    const hvp=splits[pt]||{};const w=pct/tw;
    for(const k of keys){if(hvp[k]!=null){acc[k]+=hvp[k]*w;wts[k]+=w;}}}
  const out={};for(const k of keys)out[k]=wts[k]>0?acc[k]/wts[k]:null;
  return out;
}

// HR Score: Pitcher Risk 28%, Pitch Mix 25%, Hitter 22%, Platoon 18%, Park 5%, Weather 2%
function calcHrScore(h,pRisk,ws,pf,pmComp,platWoba){
  const hs=calcHitterScore(h);
  const pfS=Math.max(0,Math.min(100,50+(pf-1)*100));
  const wsS=Math.max(0,Math.min(100,ws));
  const pmWoba=pmComp?.woba;
  const pmS=pmWoba!=null?Math.max(0,Math.min(100,(pmWoba-0.220)/(0.420-0.220)*100)):null;
  const plS=platWoba!=null?Math.max(0,Math.min(100,(platWoba-0.220)/(0.420-0.220)*100)):null;
  const C=[];
  if(pRisk!=null)C.push([pRisk,0.28]);
  if(pmS!=null)C.push([pmS,0.25]);
  if(hs!=null)C.push([hs,0.22]);
  if(plS!=null)C.push([plS,0.18]);
  C.push([pfS,0.05],[wsS,0.02]);
  const tw=C.reduce((a,b)=>a+b[1],0);
  if(!tw)return null;
  return Math.max(0,Math.min(100,Math.round(C.reduce((a,b)=>a+b[0]*b[1],0)/tw)));
}

/* ═══ HEAT DISPLAY — unified thresholds: >=65 green, >=45 yellow ══════ */
function hc(v,lo,hi,hib=true,dec=1,suf=''){
  if(v==null)return`<span class="hc hcn">—</span>`;
  let p=Math.max(0,Math.min(1,(hi===lo)?.5:(v-lo)/(hi-lo)));
  if(!hib)p=1-p;
  const c=p>=0.65?'hcg':p>=0.45?'hcy':'hcr';
  return`<span class="hc ${c}">${v.toFixed(dec)}${suf}</span>`;
}
const hcn=(v,lo,hi,h=true)=>hc(v,lo,hi,h,3);
const hcp=(v,lo,hi,h=true)=>hc(v,lo,hi,h,1,'%');
const hcv=(v,lo,hi,h=true)=>hc(v,lo,hi,h,1,' mph');

// Score pill: >=65 green, >=45 yellow, <45 red (CONSISTENT with score breakdown)
function sPill(s,big=false){
  if(s==null)return`<span class="hc hcn" style="min-width:${big?42:36}px">—</span>`;
  const c=s>=65?'hcg':s>=45?'hcy':'hcr';
  return`<span class="hc ${c}" style="min-width:${big?42:36}px;${big?'font-size:.9rem;font-weight:700':''}">${s}</span>`;
}

// Risk pill with label — same thresholds
function riskPill(r){
  if(r==null)return`<span class="pill pill-b">—</span>`;
  const c=r>=65?'pill-r':r>=45?'pill-y':'pill-g';
  const lbl=r>=65?'🔴 volatile':r>=45?'🟡 average':'🟢 safe';
  return`<span class="pill ${c}">${r}</span> <span style="font-size:.62rem;color:var(--muted)">${lbl}</span>`;
}

function fmt(v,dec=1,suf=''){return v==null?'—':v.toFixed(dec)+suf;}
function mtCls(v,lo,hi,hib){
  if(v==null)return'hcn';
  let p=Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
  if(!hib)p=1-p;return p>=0.65?'hcg':p>=0.45?'hcy':'hcr';
}

/* ═══ API ═════════════════════════════════════════════════════════════ */
async function proxied(url){
  try{const r=await fetch(url,{signal:AbortSignal.timeout(6000)});
    if(r.ok)return await r.json();}catch{}
  for(const mk of PROXIES){
    try{const r=await fetch(mk(url),{signal:AbortSignal.timeout(8000)});
      if(r.ok){const t=await r.text();
        try{const j=JSON.parse(t);return j.contents?JSON.parse(j.contents):j;}catch{}}}
    catch{}}
  return null;
}
async function proxiedText(url){
  try{const r=await fetch(url,{signal:AbortSignal.timeout(6000)});
    if(r.ok)return await r.text();}catch{}
  for(const mk of PROXIES){
    try{const r=await fetch(mk(url),{signal:AbortSignal.timeout(8000)});
      if(r.ok){const t=await r.text();
        try{const j=JSON.parse(t);if(j.contents)return j.contents;}catch{}
        return t;}}catch{}}
  return null;
}

async function getWeather(venue){
  const[lat,lon]=COORDS[venue]||[40.71,-74.01];
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,windspeed_10m,winddirection_10m&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto&forecast_days=1`);
    const d=await r.json();const h=d.hourly||{};
    return{temp:h.temperature_2m?.[13]||72,rain:h.precipitation_probability?.[13]||0,
           wind:h.windspeed_10m?.[13]||0,wdir:h.winddirection_10m?.[13]||0};
  }catch{return{temp:72,rain:0,wind:0,wdir:0};}
}
function wxScore(w){
  let s=50+Math.max(-20,Math.min(20,(w.temp-65)*0.5))-w.rain*0.4;
  const b=(w.wdir<90||w.wdir>270)?.8:-.8;
  return Math.max(0,Math.min(100,s+Math.max(-15,Math.min(15,w.wind*b))));
}
function windLbl(spd,deg){
  const d=['N','NE','E','SE','S','SW','W','NW'];
  return`${Math.round(spd)} mph ${d[Math.round(deg/45)%8]}`;
}

async function getPlayerStats(id,season){

function mapHitter(s){
  if(!s)return{};
  const n=v=>v!=null?parseFloat(v):null;
  const avg=n(s.avg),slg=n(s.slg),obp=n(s.obp);
  const so=n(s.strikeOuts),pa=n(s.plateAppearances),bb=n(s.baseOnBalls);
  return{avg,obp,slg,ops:obp!=null&&slg!=null?Math.round((obp+slg)*1000)/1000:null,
    hr:n(s.homeRuns),iso:slg!=null&&avg!=null?Math.round((slg-avg)*1000)/1000:null,
    k_pct:so&&pa?Math.round(so/pa*1000)/10:null,
    bb_pct:bb&&pa?Math.round(bb/pa*1000)/10:null,
    barrel_pct:null,hard_hit_pct:null,avg_ev:null,avg_la:null,
    pull_pct:null,fb_pct:null,swstr_pct:null,sweet_spot_pct:null};
}

function mapPitcher(s){
  if(!s)return null;
  const n=v=>v!=null?parseFloat(v):null;
  const so=n(s.strikeOuts),bf=n(s.battersFaced),bb=n(s.baseOnBalls);
  return{era:n(s.era),fip:null,xfip:null,
    k_pct:so&&bf?Math.round(so/bf*1000)/10:null,
    bb_pct:bb&&bf?Math.round(bb/bf*1000)/10:null,
    gb_pct:null,fb_pct:null,hr_per_fb:null,
    brl_pct:null,hard_hit_pct:null,avg_ev:null,ip:n(s.inningsPitched)};
}

async function getSavantBatters(season){
  if(_savBatCache)return _savBatCache;
  // Try exitvelo/barrels leaderboard first (has more complete Statcast fields)
  const urls=[
    `https://baseballsavant.mlb.com/leaderboard/statcast?type=batter&year=${season}&position=&team=&min=10&csv=true`,
    `https://baseballsavant.mlb.com/leaderboard/exit-velocity-barrels?type=batter&year=${season}&position=&team=&min=10&csv=true`,
  ];
  for(const url of urls){
    const txt=await proxiedText(url);if(!txt||txt.length<100)continue;
    const rows=txt.trim().split('\n');if(rows.length<2)continue;
    const hdrs=rows[0].split(',').map(h=>h.trim().replace(/"/g,'').toLowerCase());
    // Try multiple id column names
    const idIdx=hdrs.findIndex(h=>['player_id','batter','mlbam_id','mlbamid','xmlbamid','xmlbamid'].includes(h));
    if(idIdx<0)continue;
    const out={};
    for(let i=1;i<rows.length;i++){
      const cols=rows[i].split(',').map(c=>c.trim().replace(/"/g,''));
      const pid=cols[idIdx]?.replace(/\.0$/,'').trim();if(!pid||pid==='null'||pid==='')continue;
      const get=k=>{const idx=hdrs.indexOf(k);return idx>=0&&cols[idx]!==''?parseFloat(cols[idx])||null:null;};
      // Try all known column name variants
      const brl=get('brl_percent')??get('barrel_batted_rate')??get('barrel_percent')??get('brl_pct');
      const hh=get('ev95percent')??get('hard_hit_percent')??get('hard_hit_pct')??get('hard_hit_rate');
      const ev=get('avg_hit_speed')??get('avg_exit_velocity')??get('exit_velocity_avg')??get('avg_ev');
      const la=get('avg_hit_angle')??get('avg_launch_angle')??get('launch_angle_avg')??get('avg_la');
      const ss=get('anglesweetspotpercent')??get('sweet_spot_percent')??get('sweet_spot_pct');
      if(brl!=null||hh!=null||ev!=null){
        out[pid]={barrel_pct:brl,hard_hit_pct:hh,avg_ev:ev,avg_la:la,sweet_spot_pct:ss};
      }
    }
    if(Object.keys(out).length>10){_savBatCache=out;return out;}
  }
  return{};
}

  return out;

/* ═══ DATE ════════════════════════════════════════════════════════════ */
function ds(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dlbl(d){
  const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);
  const diff=(x-t)/864e5;
  if(diff===0)return'Today';if(diff===1)return'Tomorrow';if(diff===-1)return'Yesterday';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function shiftDate(n){

  S.date=d;S.game=null;S.openId=null;S.hitters={away:[],home:[]};loadSlate();
}

async function pickGame(idx){
  S.game=S.games[idx];S.openId=null;
  S.hitters={away:[],home:[]};S.pRows={away:null,home:null};
  S.arsenals={away:{},home:{}};
  renderGameChips();
  const g=S.game;const pf=PARK[g.home]||1.00;

  // Weather
  const w=await getWeather(g.venue);S.weather=w;const ws=wxScore(w);
  document.getElementById('wxBar').innerHTML=[
    ['🌡️',`${Math.round(w.temp)}°F`,'Temp'],
    ['💨',windLbl(w.wind,w.wdir),'Wind'],
    ['🌧️',`${Math.round(w.rain)}%`,'Rain'],
    ['🏟️',`${pf.toFixed(2)}×`,'Park'],
    ['☀️',`${Math.round(ws)}/100`,'Score'],
  ].map(([ic,v,l])=>`<div class="wchip"><span class="wv">${ic} ${v}</span><span class="wl">${l}</span></div>`).join('');

  // Pitcher hands + arsenals
  const[awH,hmH,awA,hmA]=await Promise.all([
    getPitcherHand(g.awaySpId),getPitcherHand(g.homeSpId),
    getArsenal(g.awaySpId,2026),getArsenal(g.homeSpId,2026)
  ]);
  S.pHands={away:awH,home:hmH};
  S.arsenals={away:hmA,home:awA}; // home SP faces away hitters, away SP faces home hitters

  // Team toggle
  const tt=document.getElementById('teamTog');tt.style.display='flex';
  document.getElementById('btnAway').textContent=`${g.away} vs ${g.homeSpName.split(' ').pop()}`;
  document.getElementById('btnHome').textContent=`${g.home} vs ${g.awaySpName.split(' ').pop()}`;

  renderSortStrip();renderSpCard();

  document.getElementById('hList').innerHTML='<div class="loader"><div class="spin"></div><br>Loading rosters…</div>';
  const[awRoster,hmRoster]=await Promise.all([getRoster(g.away),getRoster(g.home)]);

  document.getElementById('hList').innerHTML='<div class="loader"><div class="spin"></div><br>Loading stats…</div>';

  // Load all stat sources in parallel — Savant Statcast + FanGraphs + Savant pitcher
  const[savBat,savPit,fgBat,fgPit]=await Promise.all([
    getSavantBatters(2026),getSavantPitchers(2026),
    getFgBatters(2026),getFgPitchers(2026)
  ]);
  // Fallback to 2025 if current season empty
  const sb=Object.keys(savBat).length?savBat:await getSavantBatters(2025);
  const sp=Object.keys(savPit).length?savPit:await getSavantPitchers(2025);
  const fb=Object.keys(fgBat).length?fgBat:await getFgBatters(2025);
  const fp=Object.keys(fgPit).length?fgPit:await getFgPitchers(2025);

  async function buildPRow(spId){
    if(!spId)return null;const sid=String(spId);
    let row={era:null,fip:null,xfip:null,k_pct:null,bb_pct:null,gb_pct:null,
             fb_pct:null,hr_per_fb:null,brl_pct:null,hard_hit_pct:null,avg_ev:null,ip:null};
    // Layer 1: MLB Stats API standard stats
    for(const yr of[2026,2025]){
      const d=await getPlayerStats(sid,yr);
      if(d?.pitching){Object.assign(row,mapPitcher(d.pitching));break;}
    }
    // Layer 2: FanGraphs (FIP, xFIP, K%, BB%, FB%, HR/FB)
    const fg=fp[sid];
    if(fg){for(const[k,v]of Object.entries(fg)){if(v!=null)row[k]=v;}}
    // Layer 3: Savant Statcast (barrel%, hard hit%, EV)
    const sv=sp[sid];
    if(sv){if(sv.brl_pct!=null)row.brl_pct=sv.brl_pct;
           if(sv.hard_hit_pct!=null)row.hard_hit_pct=sv.hard_hit_pct;
           if(sv.avg_ev!=null)row.avg_ev=sv.avg_ev;}
    return row;
  }

  const[pRowAway,pRowHome]=await Promise.all([buildPRow(g.homeSpId),buildPRow(g.awaySpId)]);
  S.pRows={away:pRowAway,home:pRowHome};renderSpCard();

  async function buildHitter(h,spHand,pRow,arsenal){
    const sid=String(h.id);let stats={};
    // Layer 1: MLB Stats API — AVG/OBP/SLG/HR/K%/BB%
    for(const yr of[2026,2025]){
      const d=await getPlayerStats(sid,yr);
      if(d?.hitting){stats=mapHitter(d.hitting);break;}
    }
    // Layer 2: FanGraphs — pull%, FB%, SwStr%, O-Swing%, barrel%, hard hit%, EV, LA
    const fg=fb[sid];
    if(fg){
      if(fg.pull_pct!=null)   stats.pull_pct=fg.pull_pct;
      if(fg.fb_pct!=null)     stats.fb_pct=fg.fb_pct;
      if(fg.swstr_pct!=null)  stats.swstr_pct=fg.swstr_pct;
      if(fg.barrel_pct!=null) stats.barrel_pct=fg.barrel_pct;
      if(fg.hard_hit_pct!=null)stats.hard_hit_pct=fg.hard_hit_pct;
      if(fg.avg_ev!=null)     stats.avg_ev=fg.avg_ev;
      if(fg.avg_la!=null)     stats.avg_la=fg.avg_la;
    }
    // Layer 3: Savant Statcast — overrides FG for Statcast metrics (more precise)
    const sv=sb[sid];
    if(sv){
      if(sv.barrel_pct!=null)   stats.barrel_pct=sv.barrel_pct;
      if(sv.hard_hit_pct!=null) stats.hard_hit_pct=sv.hard_hit_pct;
      if(sv.avg_ev!=null)       stats.avg_ev=sv.avg_ev;
      if(sv.avg_la!=null)       stats.avg_la=sv.avg_la;
      if(sv.sweet_spot_pct!=null)stats.sweet_spot_pct=sv.sweet_spot_pct;
    }
    return{...h,...stats,spHand,pRow,arsenal,pitchSplits:{},platoon:{},
           hs:null,pm:{},platWoba:null,hrScore:null};
  }

  async function batchFetch(roster,spHand,pRow,arsenal){
    const res=[];const BATCH=8;
    for(let i=0;i<roster.length;i+=BATCH){
      const chunk=roster.slice(i,i+BATCH);
      const rows=await Promise.all(chunk.map(h=>buildHitter(h,spHand,pRow,arsenal)));
      res.push(...rows);
    }
    return res;
  }

  const[awH2,hmH2]=await Promise.all([
    batchFetch(awRoster,S.pHands.home,S.pRows.away,S.arsenals.away),
    batchFetch(hmRoster,S.pHands.away,S.pRows.home,S.arsenals.home)
  ]);
  S.hitters.away=awH2;S.hitters.home=hmH2;

  // Score all hitters
  const ws2=wxScore(S.weather||{temp:72,rain:0,wind:0,wdir:0});
  for(const team of['away','home']){
    const pfT=PARK[team==='away'?g.home:g.away]||1.00;
    for(const h of S.hitters[team]){
      h.hs=calcHitterScore(h);
      h.pm=calcPMComposite(h.pitchSplits,h.arsenal);
      h.hrScore=calcHrScore(h,calcPitcherRisk(h.pRow),ws2,pfT,h.pm,h.platWoba);
    }
  }
  renderHitters();
}

    const arsHtml=Object.entries(sp.arsenal).sort((a,b)=>b[1]-a[1]).map(([pt,pct])=>{
      const c=PITCH_CLR[pt]||'#6b7280';const nm=PITCH_NAMES[pt]||pt;
      const bw=Math.min(80,Math.round(pct*0.8));
      return`<div style="margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;font-size:.77rem;margin-bottom:2px">
          <span style="color:${c};font-weight:600">${nm}</span>
          <span style="font-family:'DM Mono',monospace">${pct.toFixed(1)}%</span>
        </div>
        <div style="background:var(--bdr);border-radius:3px;height:5px">
          <div style="background:${c};width:${bw}%;height:5px;border-radius:3px"></div>
        </div></div>`;
    }).join('')||'<span style="color:var(--muted);font-size:.75rem">No arsenal data</span>';

    return`<div class="sp-bd">
      <div class="sp-bd-head">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;flex:1">${sp.name}</div>
        <span style="font-size:.68rem;color:var(--muted)">${sp.hand==='L'?'LHP':'RHP'} · vs ${sp.faces}</span>
        ${riskPill(risk)}${avgNote}
      </div>
      <div class="sp-bd-body">
        <div style="display:flex;gap:12px">
          <div style="flex:1"><div class="sec-lbl" style="padding:0 0 6px">Profile</div>${statRows}</div>
          <div style="flex:1"><div class="sec-lbl" style="padding:0 0 6px">Arsenal</div>${arsHtml}</div>
        </div>
      </div></div>`;
  }).join('');
}

loadSlate();
</script>
